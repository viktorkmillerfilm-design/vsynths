/* vsynths note protocol v1 · receiver (shared, paste once per synth, then call VSN.use({...}) with the synth's own note functions)

                 {type:'vsynths:note', note, vel, on, dur, delay, at, src}  note: midi 0-127 or [notes]; vel 0-1 (or 1-127); on: true|false (default true)
                                                                            dur: s (on + auto off); delay: s from now, or at: epoch ms (performance.timeOrigin+performance.now())
                 {type:'vsynths:notes', list:[...note msgs]}               batch
                 {type:'vsynths:panic'} / {type:'vsynths:stop'}            release every note this protocol holds (the synth's own stop handler still runs for :stop)
   messages out: {type:'vsynths:ready', ...} once VSN.use() runs and on every hello; {type:'vsynths:ack', on, off} on {type:'vsynths:stats'} */

  const slugOf = () => A.slug || (location.pathname.split('/').filter(s => s && !/\.html?$/.test(s)).pop() || document.title || 'synth').toLowerCase();
  const nowMs = () => (performance.timeOrigin || 0) + performance.now();
  const ready = to => { const m = { type: 'vsynths:ready', proto: 1, slug: slugOf(), notes: !!A.on }; try { (to || (W.parent !== W ? W.parent : null)) && (to || W.parent).postMessage(m, '*'); } catch (e) {} };
  const later = (ms, f) => { if (ms <= 2) return f(); const id = setTimeout(() => { timers.delete(id); f(); }, ms); timers.add(id); };
  const v01 = v => { v = +v; if (!isFinite(v)) return 0.8; if (v > 1) v /= 127; return Math.max(0.01, Math.min(1, v)); };
  function on(n, v) { const c = live.get(n) || 0; try { if (c) A.off(n); A.on(n, v); } catch (e) {} live.set(n, c + 1); st.on++; }
  function off(n) { const c = live.get(n) || 0; if (!c) return; if (c > 1) { live.set(n, c - 1); return; } live.delete(n); try { A.off(n); } catch (e) {} st.off++; }
  function releaseAll() { timers.forEach(clearTimeout); timers.clear(); for (const n of [...live.keys()]) { live.set(n, 1); off(n); } try { A.panic && A.panic(); } catch (e) {} }
  function note(d) {
    if (!A.on) return; const ns = Array.isArray(d.note) ? d.note : [d.note], v = v01(d.vel == null ? 0.8 : d.vel);
    const ms = d.at != null ? d.at - nowMs() : (+d.delay || 0) * 1000; if (ms < -250) return; // stale (tab was asleep): drop instead of a burst
    const isOn = d.on !== false, dur = +d.dur > 0 ? Math.min(+d.dur, 30) : 0;
    for (const n0 of ns) { const n = Math.round(+n0); if (!(n >= 0 && n <= 127)) continue;

    st.msgs++;

    else if (d.type === 'vsynths:notes' && Array.isArray(d.list)) d.list.forEach(note);
    else if (d.type === 'vsynths:panic' || d.type === 'vsynths:stop') releaseAll();
    else if (d.type === 'vsynths:hello') ready(e.source);
    else if (d.type === 'vsynths:stats') { try { e.source.postMessage({ type: 'vsynths:ack', slug: slugOf(), on: st.on, off: st.off, held: live.size }, '*'); } catch (x) {} } });
