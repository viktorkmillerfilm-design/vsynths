function fields(){ const L=k=>P.line[k], F=(n,min,max,get,set,fmt)=>({n,min,max,get,set,fmt:fmt||String});
  const env=(k,key,name)=>{ const e=L(k)[key], out=[]; for(let s=0;s<=7;s++){ out.push(F(`${name} STEP${s+1} R`,0,99,()=>e.r[s],v=>e.r[s]=v)); out.push(F(`${name} STEP${s+1} L`,0,99,()=>e.l[s],v=>e.l[s]=v)); } out.env=e; out.name=name; return out; };

   case 1: case 9: { const k=prm===1?0:1; return [F(`DCO${k+1} 1ST WAVE`,1,8,()=>L(k).w1,v=>L(k).w1=v,v=>WN[v]),F(`DCO${k+1} 2ND WAVE`,0,8,()=>L(k).w2,v=>L(k).w2=v,v=>v?WN[v]:'OFF')]; }
   case 2: case 10: return env(prm===2?0:1,'dcoE',`DCO${prm===2?1:2}`);
   case 3: case 11: { const k=prm===3?0:1; return [F(`DCW${k+1} KEY FOLLOW`,0,9,()=>L(k).dcwKF,v=>L(k).dcwKF=v)]; }
   case 4: case 12: return env(prm===4?0:1,'dcwE',`DCW${prm===4?1:2}`);
   case 5: case 13: { const k=prm===5?0:1; return [F(`DCA${k+1} KEY FOLLOW`,0,9,()=>L(k).dcaKF,v=>L(k).dcaKF=v)]; }
   case 6: case 14: return env(prm===6?0:1,'dcaE',`DCA${prm===6?1:2}`);
   case 7: return [F('DETUNE +/-',0,1,()=>P.det.sign>0?1:0,v=>P.det.sign=v?1:-1,v=>v?'+':'-'),F('DETUNE OCTAVE',0,3,()=>P.det.oct,v=>P.det.oct=v),F('DETUNE NOTE',0,11,()=>P.det.note,v=>P.det.note=v),F('DETUNE FINE',0,60,()=>P.det.fine,v=>P.det.fine=v)];

function perf(k){ if(k==='solo'){ P.solo=P.solo?0:1; sendPatch(); flash('SOLO',P.solo?'ON':'OFF'); return; }

function drawEnv(){ const g=envc.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,236,86); g.fillStyle='#0f1112'; g.fillRect(0,0,236,86);
  let e=null, nm=''; if(mode==='edit'){ const f=fields(); if(f.env){ e=f.env; nm=f.name; } } if(!e){ e=P.line[0].dcaE; nm='DCA1'; }
  const tm=r=>.15+(99-r)/99*1.6; let x=6, tot=0; for(let s=0;s<=e.end;s++) tot+=tm(e.r[s]); const sc=(236-24)/(tot+.4), y=l=>78-l/99*64;
  g.strokeStyle='#2c3034'; g.lineWidth=1; for(let i=0;i<=4;i++){ g.beginPath(); g.moveTo(0,y(i*24.75)); g.lineTo(236,y(i*24.75)); g.stroke(); }
  g.strokeStyle='#9fc3ff'; g.lineWidth=1.5; g.beginPath(); g.moveTo(x,y(0)); const pts=[];
  for(let s=0;s<=e.end;s++){ x+=tm(e.r[s])*sc; g.lineTo(x,y(e.l[s])); pts.push([x,y(e.l[s]),s]); if(s===e.sus){ x+=.4*sc; g.lineTo(x,y(e.l[s])); } } g.stroke();
  pts.forEach(([px,py,s])=>{ g.fillStyle=mode==='edit'&&(cursor>>1)===s?'#f0954f':'#9fc3ff'; g.fillRect(px-2.5,py-2.5,5,5); if(s===e.sus){ g.fillStyle='#f0954f'; g.font='7px Arial'; g.fillText('S',px-2,py-6); } });
