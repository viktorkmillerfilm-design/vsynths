<script type="text/plain" id="coresrc">
/* SID-style core (MOS 6581 / 8580 flavours). Oscillators, hard sync, ring mod, noise LFSR and ADSR are clocked
   every PAL cycle (985248 Hz) and box-averaged to the output rate; multimode filter (state-variable) per sample.
   Messages: {t, w:[[reg,val],...]} with reg = offset from $D400 (0x00-0x18); {t, fx:{ch,base,arp,slide,drum,dwave}};
   {t, pwm:{ch,sp,pw}}; {cmd:'model', m:0|1}; {cmd:'silence'|'hush'} */
class Core{
  constructor(sr){
    this.sr=sr; this.clk=985248; this.cyc=this.clk/sr; this.cf=0; this.q=[]; this.reg=new Uint8Array(0x19); this.model=0;
    this.RP=[9,32,63,95,149,220,267,313,392,977,1954,3126,3907,11720,19532,31251];
    this.v=[0,1,2].map(i=>({i,acc:0,lfsr:0x7FFFF8,env:0,st:2,rc:0,ec:0,gate:0,msbUp:0,freq:0,pw:0,ctrl:0,a:0,d:0,s:0,r:0}));
    this.ic1=0; this.ic2=0; this.fcS=0; this.volS=0; this.dc=0; this.dcx=0;
    this.fx=[0,1,2].map(()=>({on:0,base:60,arp:null,slide:0,drum:0,dwave:0x41,k:0,f:0,pwm:0,pwv:2048,dir:1}));
    this.fs=0; this.fper=sr/50.125;
  }
  msg(m){ if(m.cmd){ if(m.cmd==='model') this.model=m.m; else { this.q.length=0; this.fx.forEach(f=>{f.on=0;f.arp=null;f.slide=0;f.drum=0;});
        for(let i=0;i<3;i++) this.write(i*7+4,this.reg[i*7+4]&0xFE); if(m.cmd==='hush') this.v.forEach(v=>{v.env=0;v.st=2;}); } return; }
    if(!m.t){ this.apply(m); return; } let i=this.q.length; while(i>0&&this.q[i-1].t>m.t) i--; this.q.splice(i,0,m); }
  nf(n){ return Math.max(0,Math.min(65535,Math.round(440*Math.pow(2,(n-69)/12)*16777216/this.clk))); }
  setF(c,f){ f=Math.max(0,Math.min(65535,Math.round(f))); this.write(c*7,f&255); this.write(c*7+1,f>>8); }
  apply(m){ if(m.w) for(const [a,v] of m.w) this.write(a,v);
    if(m.fx){ const f=this.fx[m.fx.ch]; Object.assign(f,m.fx); f.k=0; f.on=1; f.f=this.nf(f.base); if(f.drum){ this.setF(m.fx.ch,this.nf(f.base+36)); } }
    if(m.pwm){ const f=this.fx[m.pwm.ch]; f.pwm=m.pwm.sp; f.pwv=m.pwm.pw; } }
  write(a,val){ val&=255; if(a<0||a>0x18) return; this.reg[a]=val;
    if(a<21){ const v=this.v[(a/7)|0], r=a%7;
      if(r===0) v.freq=(v.freq&0xFF00)|val; else if(r===1) v.freq=(v.freq&0xFF)|(val<<8);
      else if(r===2) v.pw=(v.pw&0xF00)|val; else if(r===3) v.pw=(v.pw&0xFF)|((val&15)<<8);
      else if(r===4){ const g=val&1; if(g&&!v.gate){ v.st=0; } else if(!g&&v.gate){ v.st=2; } v.gate=g; if(val&8){ v.acc=0; v.lfsr=0x7FFFF8; } v.ctrl=val; }
      else if(r===5){ v.a=val>>4; v.d=val&15; } else { v.s=val>>4; v.r=val&15; } } }
  frameFx(){ for(let c=0;c<3;c++){ const f=this.fx[c];
      if(f.pwm){ f.pwv+=f.dir*f.pwm*8; if(f.pwv>0xF00){ f.pwv=0xF00; f.dir=-1; } if(f.pwv<0x100){ f.pwv=0x100; f.dir=1; } this.write(c*7+2,f.pwv&255); this.write(c*7+3,f.pwv>>8); }
      if(!f.on) continue;
      if(f.drum){ if(f.k===0) this.write(c*7+4,f.dwave); this.setF(c,this.nf(f.base+12)*Math.pow(2,-(f.k+1)*f.drum/96)); }
      else if(f.arp) this.setF(c,this.nf(f.base+f.arp[f.k%3]));
      else if(f.slide){ f.f=Math.max(0,Math.min(65535,f.f+f.slide)); this.setF(c,f.f); }
      f.k++; } }
  cutoffHz(fc){ if(this.model===1) return 30+fc*5.8;  // 8580: ~linear 30 Hz .. 12 kHz
    return 215+11800/(1+Math.exp(-(fc/2047-0.58)*10)); } // 6581: S-shaped curve, dead zone at the bottom
  run(out,t0,sr){
    const V=this.v, v0=V[0], v1=V[1], v2=V[2], RP=this.RP, reg=this.reg, m6581=this.model===0;
    for(let i=0;i<out.length;i++){
      const t=t0+i/sr; while(this.q.length&&this.q[0].t<=t) this.apply(this.q.shift());
      if(--this.fs<=0){ this.fs+=this.fper; this.frameFx(); }
      this.cf+=this.cyc; const n=this.cf|0; this.cf-=n;
      const filt=reg[0x17]&7, off3=(reg[0x18]&0x80)&&!(filt&4);
      let sF=0, sD=0;
      for(let c=0;c<n;c++){
        // oscillators
        for(let k=0;k<3;k++){ const v=V[k]; if(v.ctrl&8){ v.msbUp=0; continue; } const pa=v.acc; v.acc=(pa+v.freq)&0xFFFFFF;
          v.msbUp=!(pa&0x800000)&&(v.acc&0x800000); if(!(pa&0x80000)&&(v.acc&0x80000)){ const b=((v.lfsr>>22)^(v.lfsr>>17))&1; v.lfsr=((v.lfsr<<1)|b)&0x7FFFFF; } }
        if((v0.ctrl&2)&&v2.msbUp) v0.acc=0; if((v1.ctrl&2)&&v0.msbUp) v1.acc=0; if((v2.ctrl&2)&&v1.msbUp) v2.acc=0;
        for(let k=0;k<3;k++){ const v=V[k];
          // envelope
          if(++v.rc>=RP[v.st===0?v.a:v.st===1?v.d:v.r]){ v.rc=0;
            if(v.st===0){ if(++v.env>=255){ v.env=255; v.st=1; } }
            else { const e=v.env, ep=e>93?1:e>54?2:e>26?4:e>14?8:e>6?16:30;
              if(++v.ec>=ep){ v.ec=0; if(v.st===1){ if(e>v.s*17) v.env--; } else if(e>0) v.env--; } } }
          if(!v.env) continue; if(k===2&&off3) continue;
          const wv=v.ctrl>>4; if(!wv) continue; let w=0xFFF;
          if(wv&1){ const src=V[(k+2)%3], msb=(v.ctrl&4)?((v.acc^src.acc)&0x800000):(v.acc&0x800000); w&=((msb?~v.acc:v.acc)>>11)&0xFFF; }
          if(wv&2) w&=v.acc>>12;
          if(wv&4) w&=((v.ctrl&8)||(v.acc>>12)>=v.pw)?0xFFF:0;
          if(wv&8){ const r=v.lfsr; w&=((r>>11)&0x800)|((r>>10)&0x400)|((r>>7)&0x200)|((r>>5)&0x100)|((r>>4)&0x80)|((r>>1)&0x40)|((r<<1)&0x20)|((r<<2)&0x10); }
          if(m6581&&(wv&3)===3) w&=0xF3F; // 6581 tri+saw combo is thinner
          const o=(w-2048)*v.env;
          if(filt&(1<<k)) sF+=o; else sD+=o;
        }
      }
      const sc=n?1/(n*522240):0; let xf=sF*sc, xd=sD*sc;
      // filter
      const fc=(reg[0x15]&7)|(reg[0x16]<<3); this.fcS+=(fc-this.fcS)*0.004;
      const hz=Math.min(this.cutoffHz(this.fcS),sr*0.45), res=reg[0x17]>>4, Q=m6581?0.707+res/15*1.6:0.707+res/15*3.2, kq=1/Q;
      if(m6581) xf=Math.tanh(xf*1.4)/1.4;
      const g=Math.tan(Math.PI*hz/sr), a1=1/(1+g*(g+kq)), a2=g*a1, a3=g*a2;
      const v3=xf-this.ic2, b=a1*this.ic1+a2*v3, l=this.ic2+a2*this.ic1+a3*v3; this.ic1=2*b-this.ic1; this.ic2=2*l-this.ic2;
      const md=reg[0x18]; let y=xd+((md&0x10)?l:0)+((md&0x20)?b:0)+((md&0x40)?(xf-kq*b-l):0);
      this.volS+=((md&15)/15-this.volS)*0.003; y*=this.volS*0.2;
      const hp=y-this.dcx+0.9995*this.dc; this.dcx=y; this.dc=hp;
      out[i]=(hp===hp&&Math.abs(hp)<4)?hp:0;
    }
    if(!(this.ic1===this.ic1)||!(this.ic2===this.ic2)||!(this.dc===this.dc)){ this.ic1=this.ic2=this.dc=this.dcx=0; }
  }
  snap(){ return {r:Array.from(this.reg),env:this.v.map(v=>v.env),st:this.v.map(v=>v.st)}; }
}

</script>
<script>
const CORE_SRC=document.getElementById('coresrc').textContent;
/* ===== shared vsynths runtime (inlined; no external deps) ===== */
const $=s=>document.querySelector(s), clamp=(v,a,b)=>v<a?a:v>b?b:v;
function el(tag,cls,parent,txt){ const e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; if(parent) parent.appendChild(e); return e; }
const hex=(v,n)=>v.toString(16).toUpperCase().padStart(n,'0');
const NN=['C-','C#','D-','D#','E-','F-','F#','G-','G#','A-','A#','B-'];
const noteStr=m=>NN[m%12]+(Math.floor(m/12)-1);

/* ---- audio graph: core (AudioWorklet from Blob, ScriptProcessor fallback) -> gain -> limiter -> soft clip -> out ---- */

/* ================= driver: notes -> SID register writes ($D400 + offset) ================= */
const nf=n=>clamp(Math.round(440*Math.pow(2,(n-69)/12)*16777216/CLK),0,65535);

const lastNote=[60,60,60], gateSt=[0,0,0];
function noteOn(c,n,o,t){ o=o||{}; const b=c*7, s=S.v[c], fx=parseFx(o.fx), f=nf(n); lastNote[c]=n;
  send({t,w:[[b+5,s.a<<4|s.d],[b+6,s.s<<4|s.r],[b+2,s.pw&255],[b+3,s.pw>>8],[b,f&255],[b+1,f>>8],[b+4,ctrlB(c,0,o.w)]]});
  const t2=t?t+0.0012:0;
  send({t:t2,w:[[b+4,ctrlB(c,1,fx.drum?8:o.w)]]}); gateSt[c]=1;
  send({t:t2,fx:{ch:c,base:n,arp:fx.arp,slide:fx.slide,drum:fx.drum,dwave:ctrlB(c,1,o.w===8?4:o.w)}}); }

function filtRegs(){ const F=S.f; return [[0x15,F.fc&7],[0x16,F.fc>>3],[0x17,F.res<<4|F.fx<<3|F.f3<<2|F.f2<<1|F.f1],[0x18,F.off3<<7|F.hp<<6|F.bp<<5|F.lp<<4|F.vol]]; }

function tick(){ const ahead=now()+0.12; while(SQ.next<ahead){ playRow(SQ.row,SQ.next); SQ.vis.push({t:SQ.next,r:SQ.row}); SQ.row=(SQ.row+1)%ROWS; SQ.next+=rowDur(); } }

/* ================= MIDI export: one track per voice ================= */
function buildMidi(){ const T=24, total=ROWS*T, tr=[[],[],[]];
  for(let c=0;c<NCH;c++){ let open=null; const end=k=>{ if(open){ open.en=Math.max(open.st+6,k*T); tr[c].push(open); open=null; } };
    for(let r=0;r<ROWS;r++){ const x=S.pat[c][r]; if(x.n===-1){ end(r); continue; } if(x.n==null) continue; end(r);
      const drum=x.fx&&x.fx[0]==='3', noise=(x.w??S.v[c].wave)===8; open={p:x.n,st:r*T,en:0,v:100};
      if(drum||noise){ open.en=r*T+T-4; tr[c].push(open); open=null; } }
    end(ROWS); }
  return buildSMF(S.bpm,[0,1,2].map(c=>({name:'voice '+(c+1),ch:c,notes:tr[c]})),total); }

document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='SELECT') return;
  if(e.code==='Space'){ e.preventDefault(); SQ.on?stop():play(); return; }
  if(e.key==='Escape'&&$('#help').style.display==='block'){ toggleHelp(); return; }
  if(e.code==='ArrowUp'){ e.preventDefault(); moveCur(-1); return; } if(e.code==='ArrowDown'){ e.preventDefault(); moveCur(1); return; }
  if(e.code==='ArrowLeft'||e.code==='ArrowRight'){ e.preventDefault(); fmove(e.code==='ArrowLeft'?-1:1); return; }
  if(e.code==='Tab'){ e.preventDefault(); CUR.c=(CUR.c+(e.shiftKey?2:1))%NCH; CUR.f=0; renderTrk(); return; }
  if(e.code==='Delete'||e.code==='Backspace'){ e.preventDefault(); clearField(); return; }
  const k=FIELDS[CUR.f];
  if(k!=='n'&&/^[0-9a-fA-F]$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){ editHex(parseInt(e.key,16)); return; }
  if(k==='n'&&(e.code==='Digit1'||e.code==='Equal')){ enterNote(-1); return; }
  if(computerKey(e,true)) e.preventDefault();
});

<b>Panel = the real registers.</b> Per voice: FREQ ($D400/01, set by notes), PW 12-bit ($D402/03), CONTROL ($D404: NOISE PULSE SAW TRI TEST RING SYNC GATE; several waveforms at once = combined waveforms), ATK/DCY ($D405) and STN/RLS ($D406), 0-15 with the chip's rate tables. Filter: CUTOFF 11-bit ($D415/16), RES 0-15 + FILT1/2/3/EX routing ($D417), LP/BP/HP/3OFF + VOL ($D418). Sync: v1←v3, v2←v1, v3←v2; ring mod replaces the triangle with the source's MSB. <b>PWM</b> is the player's software pulse-width sweep (not a register).<br><br>
<b>Tracker</b>: 32 rows × 3 voices; columns note · wave (1 tri, 2 saw, 4 pulse, 8 noise, combos) · fx. Effects run at 50 Hz: <b>0xy</b> arpeggio chord, <b>1xx</b>/<b>2xx</b> slide up/down, <b>3xx</b> drum (noise attack, then a pitch drop). Tap a cell to move; the keyboard plays the cursor's voice. <b>REC</b>: keys enter notes.<br><br>
<b>Keys</b>: a w s e d f t g y h u j k, z/x octave, space play/stop, arrows move, 0-9 a-f hex, 1 or = note-off, delete clear. MIDI IN for Web MIDI. EXPORT .MID: one track per voice (ch 1-3).`;
function toggleHelp(){ help.style.display=help.style.display==='block'?'none':'block'; } help.addEventListener('click',toggleHelp);
