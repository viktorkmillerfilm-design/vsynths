<title>VACID · Acid Line</title>
<style>
  html,body{margin:0;height:100%;background:#262729;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;
    touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #rot{display:none;color:#bbb;font-size:14px;margin-bottom:10px;letter-spacing:.05em;text-align:center}
  @media (orientation:portrait) and (max-width:900px){#rot{display:block}}
  #probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  #stage{position:relative}
  #panel{position:absolute;left:0;top:0;transform-origin:0 0;touch-action:none;border-radius:8px;
    background:linear-gradient(#3a3b3d,#1d1e20);box-shadow:0 20px 60px #000c}
  #panel *{position:absolute;box-sizing:border-box}
  .alu{background:repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,rgba(0,0,0,.035) 1px 2px,rgba(255,255,255,.04) 2px 4px),
      linear-gradient(#e3e3df,#c9c9c5);border-radius:3px;box-shadow:inset 0 2px 0 #fffa,inset 0 -2px 0 #0003}
  .well{background:#8e8f8d;border-radius:4px;box-shadow:inset 0 3px 6px #0006}
  .cell{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,rgba(0,0,0,.03) 1px 3px),linear-gradient(#dcdcd8,#cbcbc7);
      border:2px solid #9b9c99;border-radius:2px}
  .blk{background:#1b1b1c}
  .wk{background:linear-gradient(#f6f6f4,#e4e4e1);border-right:2px solid #b5b5b2}
  .bk{background:linear-gradient(#262626,#111);box-shadow:0 3px 5px #0007}
  .t{white-space:nowrap;color:#161616;font-weight:700;transform:translate(-50%,-50%);line-height:1;letter-spacing:.02em}
  .t.l{transform:translate(0,-50%)} .t.w{color:#f2f2f2} .t.r{color:#ff3a1a} .t.n{font-weight:400}
  .tag{background:#161616;color:#f2f2f2;padding:.18em .35em;border-radius:1px}
  .box{border:1.5px solid #161616;padding:.15em .35em}
  .btn{cursor:pointer;border-radius:2px;background:linear-gradient(90deg,#9d9e9c,#f1f1ef 18%,#d6d6d3 55%,#a7a8a5);

<script>
'use strict';
/* =============== state =============== */
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const MODES=['WRITE TRACK','PLAY TRACK','PLAY PATTERN','WRITE PATTERN'];
const KDEF={tune:4, cutoff:320, reso:0.72, envmod:0.55, decay:0.35, accent:0.6, volume:0.75};
const LS='vacid.hw.v1', N=16, NB=32;
const emptyStep=()=>({on:false,n:0,oct:0,a:false,s:false,tie:false});
const S={k:{...KDEF}, wave:'sawtooth', drive:0.35, bpm:145, mode:3, group:0, pat:0,
  banks:Array.from({length:NB},()=>Array.from({length:N},emptyStep)), sub:true, kick:true, sc:true, pitch:true, fn:false};
let sel=0;
const bankIx=()=>S.group*8+S.pat, pat=()=>S.banks[bankIx()];
const writeMode=()=>S.mode===0||S.mode===3;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)), mtof=m=>440*Math.pow(2,(m-69)/12);
const acidMidi=s=>36+S.k.tune+s.n+12*s.oct;
const subMidi=()=>24+S.k.tune;
const keyName=()=>NAMES[((S.k.tune%12)+12)%12];
const patName=()=>['I','II','III','IV'][S.group]+'-'+(S.pat+1);

/* =============== audio =============== */
class Engine{
  constructor(ctx){
    const c=this.ctx=ctx, g=()=>c.createGain();
    this.lim=c.createDynamicsCompressor(); this.lim.threshold.value=-4; this.lim.ratio.value=16; this.lim.attack.value=0.002; this.lim.release.value=0.08;
    this.out=g(); this.out.gain.value=0.9; this.out.connect(this.lim);

    this.ceil=g(); this.ceil.gain.value=0.93; this.lim.connect(this.clip); this.clip.connect(this.ceil); this.ceil.connect(c.destination);
    this.osc=c.createOscillator(); this.f1=c.createBiquadFilter(); this.f2=c.createBiquadFilter(); this.f1.type=this.f2.type='lowpass';

    this.sh=c.createWaveShaper(); const cv=new Float32Array(2048);
    for(let i=0;i<2048;i++){const x=i/2047*2-1; cv[i]=Math.tanh(x*2.5)/Math.tanh(2.5);} this.sh.curve=cv; this.sh.oversample='2x';
    [this.osc,this.f1,this.f2,this.vca,this.pre,this.sh,this.post,this.duck,this.vol,this.out].reduce((a,b)=>(a.connect(b),b));

  }
  apply(){

  }
  acid(t,midi,acc,slideIn,slideOut,sd){
    const k=S.k, f=mtof(midi), amt=acc?k.accent:0, lvl=0.55*(1+amt*0.8);
    this.osc.frequency.cancelScheduledValues(t); this.vca.gain.cancelScheduledValues(t);
    if(slideIn&&this.held){ this.osc.frequency.setTargetAtTime(f,t,0.02); this.vca.gain.setTargetAtTime(lvl,t,0.01); }
    else{
      this.osc.frequency.setValueAtTime(f,t);
      const peak=Math.min(16000,k.cutoff*Math.pow(2,k.envmod*5+amt*2.5)), dec=acc?Math.min(k.decay,0.2):k.decay;
      for(const fl of [this.f1,this.f2]){ fl.frequency.cancelScheduledValues(t);
        fl.frequency.setTargetAtTime(peak,t,0.0015); fl.frequency.setTargetAtTime(k.cutoff,t+0.006,Math.max(0.01,dec/3)); }

  }
  release(t){ this.held=false; this.vca.gain.cancelScheduledValues(t); this.vca.gain.setTargetAtTime(0,t,0.006); }

    const c=this.ctx,o=c.createOscillator(),g=c.createGain(),end=t+sd*0.7;
    o.frequency.value=mtof(subMidi()); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.75,t+0.002);
    g.gain.setTargetAtTime(0,t+0.004,0.12); g.gain.setTargetAtTime(0,end,0.004);
    o.connect(g); g.connect(this.subIn); o.start(t); o.stop(end+0.06); o.onended=()=>{o.disconnect();g.disconnect();};
  }
  kickHit(t){
    const c=this.ctx,o=c.createOscillator(),g=c.createGain();
    o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(58,t+0.045); o.frequency.exponentialRampToValueAtTime(42,t+0.28);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.95,t+0.002); g.gain.setTargetAtTime(0.7,t+0.004,0.04); g.gain.setTargetAtTime(0,t+0.12,0.06);
    o.connect(g); g.connect(this.out); o.start(t); o.stop(t+0.7); o.onended=()=>{o.disconnect();g.disconnect();};
    if(!S.sc) return;
    for(const [p,d] of [[this.subDuck.gain,0.9],[this.duck.gain,0.5]]){ p.cancelScheduledValues(t); p.setTargetAtTime(1-d,t,0.003); p.setTargetAtTime(1,t+0.04,0.04); }
  }
  silence(){ const t=this.ctx.currentTime; this.release(t); for(const p of [this.duck.gain,this.subDuck.gain]){p.cancelScheduledValues(t);p.setTargetAtTime(1,t,0.01);} }
}

let ctx=null, eng=null, playing=false, timer=0, gNext=0, gK=0, aNext=0, aK=0, vis=[], cur=-1, first=true, prevOn=false, prevSlide=false;
const beat=()=>60/S.bpm;
function ensureAudio(){ if(!ctx){ ctx=new (window.AudioContext||window.webkitAudioContext)(); eng=new Engine(ctx);} if(ctx.state!=='running') ctx.resume(); }
/* iOS: unlock Web Audio on the first touch, and keep a silent looping <audio> playing so the

let unlocked=false, silentEl=null;

  w(0,'RIFF');b.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b.buffer],{type:'audio/wav'})); }
function unlockAudio(){
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}

  if(unlocked) return; unlocked=true;
  try{ const buf=ctx.createBuffer(1,1,22050), src=ctx.createBufferSource(); src.buffer=buf; src.connect(ctx.destination); src.start(0); }catch(e){}
  try{ silentEl=document.createElement('audio'); silentEl.setAttribute('playsinline',''); silentEl.setAttribute('x-webkit-airplay','deny');
    silentEl.loop=true; silentEl.preload='auto'; silentEl.src=silentWavUrl(); const pr=silentEl.play(); if(pr&&pr.catch) pr.catch(()=>{}); }catch(e){}
}
for(const ev of ['touchend','pointerdown','keydown']) document.addEventListener(ev,unlockAudio,{capture:true,passive:true});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&ctx&&ctx.state!=='running') ctx.resume(); });
function tick(){
  const ahead=ctx.currentTime+0.12, sd=beat()/4;
  while(gNext<ahead){ if(S.kick&&gK%4===0) eng.kickHit(gNext); if(S.sub&&gK%4!==0) eng.subNote(gNext,sd); gK++; gNext+=sd; }
  while(aNext<ahead){
    const p=pat(), i=aK%N, s=p[i], nx=p[(i+1)%N], t=aNext;
    const holdOut = s.on && (s.s || (nx.on && nx.tie));
    if(s.on && s.tie && eng.held && !first){ eng.held=holdOut; if(!holdOut){ eng.vca.gain.cancelScheduledValues(t); eng.vca.gain.setTargetAtTime(0,t+sd*0.55,0.006); } }
    else if(s.on) eng.acid(t,acidMidi(s),s.a,!first&&prevOn&&prevSlide,holdOut,sd);
    else if(eng.held) eng.release(t);
    prevOn=s.on; prevSlide=s.s; first=false; vis.push({t,i}); aK++; aNext+=sd;
  }
}
function run(){ ensureAudio(); playing=true; first=true; gK=aK=0; vis=[]; gNext=aNext=ctx.currentTime+0.06; tick(); timer=setInterval(tick,20); refresh(); }
function stop(){ playing=false; clearInterval(timer); eng&&eng.silence(); vis=[]; cur=-1; refresh(); }
function audition(m){ if(playing) return; ensureAudio(); eng.acid(ctx.currentTime+0.01,m,false,false,false,0.22); }
(function loop(){
  if(playing&&ctx){ const now=ctx.currentTime-(ctx.outputLatency||0); let ch=false;
    while(vis.length&&vis[0].t<=now){ cur=vis.shift().i; ch=true; } if(ch) refreshLive(); }
  requestAnimationFrame(loop);
})();

/* =============== generate / modify / undo =============== */
const SC=[0,1,3,5,7,8,10,12], rnd=Math.random, pick=a=>a[Math.floor(rnd()*a.length)];
let undo=[];
function pushUndo(){ undo.push({b:bankIx(),p:JSON.parse(JSON.stringify(pat()))}); if(undo.length>50) undo.shift(); }
function doUndo(){ const u=undo.pop(); if(!u){ flash('NOTHING TO UNDO'); return; } S.banks[u.b]=u.p; S.group=u.b>>3; S.pat=u.b&7; save(); refresh(); flash('UNDO'); }
function generate(){
  pushUndo();
  S.banks[bankIx()]=Array.from({length:N},(_,i)=>{ const on=i===0||rnd()<0.74, r=rnd();
    return {on, n:r<0.5?0:pick(SC), oct:r>0.85?1:(r>0.8?-1:0), a:rnd()<0.3, s:rnd()<0.2, tie:i>0&&on&&rnd()<0.05}; });
  save(); refresh(); flash('GENERATED '+patName());
}
function modify(){
  pushUndo(); const p=pat(), n=2+Math.floor(rnd()*3);
  for(let j=0;j<n;j++){ const s=p[Math.floor(rnd()*N)], r=rnd();
    if(r<0.35){ const ix=SC.indexOf(s.n); s.n=ix<0?0:SC[clamp(ix+(rnd()<0.5?-1:1),0,SC.length-1)]; s.on=true; s.tie=false; }
    else if(r<0.55) s.a=!s.a; else if(r<0.72) s.s=!s.s; else if(r<0.86){ s.on=!s.on; s.tie=false; } else s.oct=s.oct?0:pick([1,-1]); }
  save(); refresh(); flash('MODIFIED');
}

/* =============== MIDI (format 1: Acid ch1 + Sub ch2, 4 bars) =============== */
const vlq=n=>{const b=[n&127]; while(n>>=7) b.unshift((n&127)|128); return b;};
function track(name,notes,ch,tempo,total){
  const ev=[]; notes.forEach(n=>{ev.push([n.st,1,n]);ev.push([n.en,0,n]);}); ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const d=[0,0xFF,3,name.length,...[...name].map(c=>c.charCodeAt(0))];
  if(tempo){ const us=Math.round(6e7/S.bpm); d.push(0,0xFF,0x51,3,us>>16&255,us>>8&255,us&255,0,0xFF,0x58,4,4,2,24,8); }
  let now=0; for(const [t,on,n] of ev){ d.push(...vlq(t-now)); now=t; d.push((on?0x90:0x80)|ch,n.p,on?n.v:64); }
  d.push(...vlq(total-now),0xFF,0x2F,0); const L=d.length;
  return [0x4D,0x54,0x72,0x6B,L>>>24&255,L>>16&255,L>>8&255,L&255,...d];
}
function buildMidi(){
  const PPQ=96, T=24, steps=64, total=steps*T, p=pat(), acid=[], sub=[]; let last=null;
  const at=k=>p[k%N];
  const endFor=k=>{ const s=at(k), nx=k+1<steps?at(k+1):null, st=k*T;
    if(s.s) return nx ? (k+1)*T+(nx.on&&!nx.tie?6:0) : total;
    return (nx&&nx.on&&nx.tie) ? (k+1)*T : st+13; };
  for(let k=0;k<steps;k++){
    const s=at(k), prev=k?at(k-1):null;
    if(!s.on){ last=null; continue; }
    const en=Math.min(endFor(k),total), v=s.a?127:90;
    if(s.tie&&last){ last.en=en; continue; }
    const pm=clamp(acidMidi(s),0,127);
    if(prev&&last&&prev.on&&prev.s&&last.p===pm){ last.en=en; last.v=Math.max(last.v,v); continue; }
    acid.push(last={p:pm,st:k*T,en,v});
  }
  if(S.sub) for(let k=0;k<64;k++) if(k%4) sub.push({p:subMidi(),st:k*24,en:k*24+17,v:100});
  return new Uint8Array([0x4D,0x54,0x68,0x64,0,0,0,6,0,1,0,2,0,PPQ,...track('Acid',acid,0,true,total),...track('Sub',sub,1,false,total)]);
}
function exportMidi(){
  const name=`vacid_${patName()}_${keyName()}_${S.bpm}bpm.mid`, blob=new Blob([buildMidi()],{type:'audio/midi'});
  const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.rel='noopener'; document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); flash('MIDI EXPORTED'); };
  if(iOS&&navigator.canShare){ try{ const f=new File([blob],name,{type:'audio/midi'});
      if(navigator.canShare({files:[f]})){ navigator.share({files:[f],title:name}).then(()=>flash('MIDI SHARED')).catch(e=>{ if(e&&e.name!=='AbortError') dl(); }); return; } }catch(e){} }
  dl();
}

/* =============== panel construction (1024 x 504 reference grid) =============== */
const U=2, W=1024, H=504, panel=document.getElementById('panel');
panel.style.width=W*U+'px'; panel.style.height=H*U+'px';
function mk(cls,x,y,w,h,parent=panel){ const e=document.createElement('div'); if(cls) e.className=cls;
  Object.assign(e.style,{left:x*U+'px',top:y*U+'px'}); if(w!=null) e.style.width=w*U+'px'; if(h!=null) e.style.height=h*U+'px'; parent.appendChild(e); return e; }
function T(txt,x,y,size,cls='',parent=panel){ const e=mk('t '+cls,x,y,null,null,parent); e.textContent=txt; e.style.fontSize=size*U+'px'; return e; }
function led(x,y,r=3.6,parent=panel){ return mk('led',x-r,y-r,2*r,2*r,parent); }
function btn(x,y,w,h,onclick,onlong,cls='btn'){ const b=mk(cls,x,y,w,h); let lt=0,fired=false;
  if(onlong){ b.addEventListener('pointerdown',()=>{ fired=false; clearTimeout(lt); lt=setTimeout(()=>{ fired=true; onlong(); if(navigator.vibrate) navigator.vibrate(20); },600); });
    for(const ev of ['pointerup','pointercancel','pointerleave']) b.addEventListener(ev,()=>clearTimeout(lt));
    b.addEventListener('contextmenu',e=>e.preventDefault()); }
  if(onclick) b.addEventListener('click',e=>{ if(fired){ fired=false; return; } onclick(e); });
  return b; }
function mini(label,x,y,w,onclick,onlong){ const b=btn(x,y,w,10,onclick,onlong,'mini'); b.textContent=label; b.style.fontSize=5.2*U+'px'; return b; }

/* silver knurled knob ('silver') or black-ring selector with silver bar ('bar') */
const knobs={}; let kid=0;
function knob(key,{x,y,r,min=0,max=1,log=false,ticks=11,steps=null,angles=null,label,fmt,get,set,def,style='silver',int=false}){

  let tk=''; for(let i=0;i<ticks;i++){ const a=(-135+270*i/(ticks-1))*Math.PI/180, l=(i%5===0)?7.5:5.5;
    tk+=`<line x1="${(Math.sin(a)*(r+2.5)).toFixed(2)}" y1="${(-Math.cos(a)*(r+2.5)).toFixed(2)}" x2="${(Math.sin(a)*(r+l)).toFixed(2)}" y2="${(-Math.cos(a)*(r+l)).toFixed(2)}" stroke="#222" stroke-width="1.1"/>`; }

    <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f2"/><stop offset=".5" stop-color="#a9aaa6"/><stop offset="1" stop-color="#e2e2df"/></linearGradient>
    <linearGradient id="${id}b" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d8e8a"/><stop offset=".35" stop-color="#fbfbfa"/><stop offset=".7" stop-color="#bdbdb9"/><stop offset="1" stop-color="#7b7c78"/></linearGradient></defs>`;
  const body = style==='bar'
    ? `<circle r="${r+0.8}" fill="#0007" cy="2"/><circle r="${r}" fill="#121212" stroke="#000" stroke-width="1"/><circle r="${r*0.86}" fill="url(#${id}s)" stroke="#333" stroke-width=".8"/>
       <g class="rot"><rect x="${-r*0.3}" y="${-r*0.84}" width="${r*0.6}" height="${r*1.68}" rx="${r*0.12}" fill="url(#${id}b)" stroke="#444" stroke-width=".8"/>
       <rect x="${-r*0.3}" y="${-r*0.84}" width="${r*0.6}" height="${r*0.5}" rx="${r*0.1}" fill="#fff" opacity=".55"/></g>`
    : `<circle r="${r+0.8}" fill="#0007" cy="2"/>
       <g class="rot"><circle r="${r}" fill="url(#${id}s)" stroke="#555" stroke-width=".7"/>
       <circle r="${r*0.9}" fill="none" stroke="#3d3d3b" stroke-width="${r*0.16}" stroke-dasharray="${(r*0.11).toFixed(2)} ${(r*0.08).toFixed(2)}" opacity=".75"/>
       <circle r="${r*0.68}" fill="url(#${id}c)" stroke="#6a6a67" stroke-width=".8"/>
       <rect x="${-r*0.07}" y="${-r*0.98}" width="${r*0.14}" height="${r*0.36}" fill="#1a1a1a"/></g>`;
  e.innerHTML=`<svg width="${2*R*U}" height="${2*R*U}" viewBox="${-R} ${-R} ${2*R} ${2*R}" style="position:static;overflow:visible">${defs}${tk}${body}</svg>`;

  const toN=v=>log?Math.log(v/min)/Math.log(max/min):(v-min)/(max-min), fromN=n=>log?min*Math.pow(max/min,n):min+n*(max-min);
  const g=get||(()=>S.k[key]), st=set||(v=>{S.k[key]=v;});
  function render(){ const v=g(), a=steps?angles[v]:-135+270*clamp(toN(v),0,1); rot.setAttribute('transform',`rotate(${a})`); }
  function setV(v){ if(steps) v=clamp(Math.round(v),0,steps-1); else { v=clamp(v,min,max); if(int) v=Math.round(v); }
    if(v===g()&&steps) return; st(v); render(); eng&&eng.apply(); save(); if(label) flash(label+' '+(fmt?fmt(g()):Math.round(toN(g())*100)+'%')); refresh(); }
  let y0=null,v0=0;
  e.addEventListener('pointerdown',ev=>{ y0=ev.clientY; v0=steps?g():toN(g()); e.setPointerCapture(ev.pointerId); ev.preventDefault(); });
  e.addEventListener('pointermove',ev=>{ if(y0===null) return; const dy=y0-ev.clientY;
    if(steps) setV(v0+Math.round(dy/30)); else setV(fromN(clamp(v0+dy*(ev.shiftKey?0.001:0.005),0,1))); });
  e.addEventListener('pointerup',()=>y0=null);
  e.addEventListener('wheel',ev=>{ ev.preventDefault(); const d=ev.deltaY<0?1:-1; if(steps||int) setV(g()+d); else setV(fromN(clamp(toN(g())+d*(ev.shiftKey?0.005:0.03),0,1))); },{passive:false});
  e.addEventListener('dblclick',()=>{ if(def!==undefined) setV(def); });
  knobs[key]={render,setV}; render(); return e;
}

/* =============== editing =============== */
function noteName(s){ const m=acidMidi(s); return NAMES[m%12]+(Math.floor(m/12)-1); }
function stepMove(d){ sel=(sel+d+N)%N; refresh(); flash('STEP '+(sel+1)+' '+stepDesc(pat()[sel])); }
function stepDesc(s){ return !s.on?'REST':s.tie?'TIE':noteName(s); }
function pressKey(n,wi){
  if(!writeMode()){ // PLAY: white keys select pattern in the current group, black keys audition
    if(wi!==undefined){ S.pat=wi; save(); refresh(); flash('PATTERN '+patName()); } else audition(36+S.k.tune+n); return; }
  if(S.fn){
    if(wi!==undefined){ sel=Math.floor(sel/8)*8+wi; refresh(); flash('STEP '+(sel+1)); return; }
    if(n===1||n===3){ pushUndo(); const p=pat();
      if(n===1){ p.splice(sel,1); p.push(emptyStep()); flash('DEL STEP '+(sel+1)); } else { p.splice(sel,0,emptyStep()); p.pop(); flash('INS STEP '+(sel+1)); }
      save(); refresh(); }
    return;
  }
  if(!S.pitch){ audition(36+S.k.tune+n); return; }
  const s=pat()[sel]; pushUndo(); s.n=n; s.on=true; s.tie=false; audition(acidMidi(s)); flash('STEP '+(sel+1)+' '+noteName(s));
  save(); refresh();
}
function toggleFx(k){
  if(!writeMode()){ flash('SET MODE TO WRITE TO EDIT'); return; }
  const s=pat()[sel]; pushUndo();
  if(k==='a') s.a=!s.a; else if(k==='s') s.s=!s.s; else if(k==='u') s.oct=s.oct===1?0:1; else s.oct=s.oct===-1?0:-1;
  save(); refresh();
}
function cycleTime(){
  if(!writeMode()){ flash('SET MODE TO WRITE TO EDIT'); return; }
  const s=pat()[sel]; pushUndo();
  if(s.on&&!s.tie){ s.tie=true; } else if(s.on&&s.tie){ s.on=false; s.tie=false; } else { s.on=true; s.tie=false; }
  save(); refresh(); flash('STEP '+(sel+1)+' '+stepDesc(s));
}

/* =============== refresh =============== */
let flashT=0;
function flash(m){ msg.textContent=m; msg.classList.add('show'); clearTimeout(flashT); flashT=setTimeout(()=>msg.classList.remove('show'),1200); }
function refreshLive(){
  const p=pat(), wm=writeMode(), s=p[sel], ps=playing&&cur>=0?p[cur]:null;
  stepLeds.forEach((e,i)=>{ e.className='s'+(p[i].on?(p[i].tie?' tie':' on'):'')+(playing&&i===cur?' cur':'')+(wm&&i===sel?' sel':''); });
  const show = wm ? s : (ps||null);
  fxLed.a.classList.toggle('on',!!(show&&show.on&&show.a)); fxLed.s.classList.toggle('on',!!(show&&show.on&&show.s));
  fxLed.d.classList.toggle('on',!!(show&&show.on&&show.oct<0)); fxLed.u.classList.toggle('on',!!(show&&show.on&&show.oct>0));
  tmLed.note.classList.toggle('on',!!(show&&show.on&&!show.tie)); tmLed.tie.classList.toggle('on',!!(show&&show.on&&show.tie)); tmLed.rest.classList.toggle('on',!!(show&&!show.on));
  const page=Math.floor(sel/8);
  for(const nk in keyLeds){ const n=+nk; let on=false, wi=WK.indexOf(n);
    if(!wm) on = wi===S.pat;
    else if(S.fn) on = wi>=0 && page*8+wi===sel;
    else on = s.on && !s.tie && s.n===n;
    keyLeds[nk].classList.toggle('on',on); }
  runLed.classList.toggle('on',playing&&(cur<0||cur%4<2));
}
function refresh(){
  wth.style.left=(S.wave==='sawtooth'?0:15)*U+'px';
  optLed.sub.classList.toggle('on',S.sub); optLed.kick.classList.toggle('on',S.kick);
  pitchLed.classList.toggle('on',S.pitch); fnLed.classList.toggle('on',S.fn);
  modeLbl.forEach((t,i)=>{ t.style.background=i===S.mode?'#161616':'transparent'; t.style.color=i===S.mode?'#fff':'#161616'; });
  Object.values(knobs).forEach(k=>k.render());
  runBtn.classList.toggle('press',playing);
  refreshLive();
}

/* =============== persistence, keys, scaling =============== */
let saveT=0; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){} },200); }
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); playing?stop():run(); }
  else if(e.code==='ArrowRight') stepMove(1); else if(e.code==='ArrowLeft') stepMove(-1);
  else if((e.ctrlKey||e.metaKey)&&e.code==='KeyZ'){ e.preventDefault(); doUndo(); }
  else if(e.key==='Escape'&&help.style.display==='block') toggleHelp();
},true);
function fit(){ const pr=getComputedStyle(document.getElementById('probe')), px=v=>parseFloat(v)||0;
  const vw=(window.visualViewport?visualViewport.width:innerWidth)-px(pr.paddingLeft)-px(pr.paddingRight);
  const rot=document.getElementById('rot'), rh=rot.offsetHeight?rot.offsetHeight+10:0;
  const vh=(window.visualViewport?visualViewport.height:innerHeight)-px(pr.paddingTop)-px(pr.paddingBottom)-rh;
  const m=vw<1000?4:16, s=Math.min((vw-m)/(W*U),(vh-m)/(H*U));
  panel.style.transform=`scale(${s})`; const st=document.getElementById('stage'); st.style.width=W*U*s+'px'; st.style.height=H*U*s+'px'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,250)); if(window.visualViewport) visualViewport.addEventListener('resize',fit); fit();
try{
  const o=JSON.parse(localStorage.getItem(LS));
  if(o&&Array.isArray(o.banks)&&o.banks.length===NB){ Object.assign(S,o,{k:{...KDEF,...o.k}}); }
  else { // migrate the previous version's 8 patterns into group I, else start with a generated line
    const old=JSON.parse(localStorage.getItem('vacid.tb.v1'));
    if(old&&Array.isArray(old.banks)){ old.banks.slice(0,8).forEach((b,i)=>{ S.banks[i]=b.map(s=>Object.assign(emptyStep(),s)); });
      if(old.bpm) S.bpm=old.bpm; if(old.k) Object.assign(S.k,{tune:old.k.tune??4,cutoff:old.k.cutoff??320,reso:old.k.reso??.72,envmod:old.k.envmod??.55,decay:old.k.decay??.35,accent:old.k.accent??.6,volume:old.k.volume??.75}); }
    if(!pat().some(s=>s.on)){ generate(); undo=[]; }
  }
}catch(e){ generate(); undo=[]; }
refresh();

/* vsynths picker: on {type:'vsynths:stop'} stop the sequencer, silence voices and suspend audio; the next tap/key resumes it */
window.addEventListener('message',e=>{ const d=e.data; if(d&&typeof d==='object'&&d.type==='vsynths:stop'){ try{ stop(); }catch(_){} if(ctx&&ctx.state==='running') ctx.suspend().catch(()=>{}); } });
