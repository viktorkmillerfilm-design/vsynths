<script type="text/plain" id="dspsrc">// 8-register sampler: zero-order-hold playback at a note-dependent sample clock (no interpolation, like early digital samplers), per-voice tracking lowpass

    } }

  case '8': header('SAMPLING'); { const rows=[['SAMPLE RATE',R.rate+' HZ'],['RESOLUTION',R.bits+' BIT'],['LENGTH',R.d.length+' SAMPLES  ('+(R.d.length/R.rate).toFixed(2)+' S)'],['LOOP',R.p.loop?'ON  '+R.ls+' - '+R.le:'OFF'],['SOURCE',R.src==='lib'?'LIBRARY '+R.name:R.name]];
      rows.forEach(([a,b],i)=>{ const sl=sel.row===i&&i<2; txt((sl?'> ':'  ')+a.padEnd(14)+b,1,2+i*1.5,sl?'#e2fff2':GR); if(i<2) hit(10,14+(2+i*1.5)*LH-10,400,20,()=>{ sel={row:i,col:0}; draw(); }); });
      const x0=30,y0=152,w=640,h=136; box(x0,y0,w,h); wave(R.d,x0,y0,w,h,R.ls,R.le);
      hit(x0,y0,w,h,(x,y,first)=>{ const p=Math.round(VS.clamp((x-x0)/w,0,1)*R.d.length); if(first) R._drag=Math.abs(p-R.ls)<Math.abs(p-R.le)?'ls':'le'; if(R._drag==='ls') R.ls=Math.min(p,R.le-64); else R.le=Math.max(p,R.ls+64); R.p.loop=1; pushReg(cur); draw(); },true);
      txt('▲▼ CHANGE SELECTED LINE (RE-SAMPLES)  ·  DRAG ON WAVE TO SET LOOP',1,18.4+1.4,GD); } break;
  case 'D': header('WAVEFORM DISPLAY'); { const segs=32, L=R.d.length, sl=Math.floor(L/segs), x0=90, y0=306, w=420, h=58;
      for(let s=segs-1;s>=0;s--){ const ox=x0+s*5.2, oy=y0-s*7.2; g.strokeStyle=s%8===0?GR:GD; g.beginPath(); g.fillStyle='#020803';
        const pts=[]; for(let i=0;i<=96;i++){ const v=R.d[Math.min(L-1,s*sl+Math.floor(i/96*Math.min(sl,512)))]||0; pts.push([ox+i/96*w,oy-v*h]); }
        g.moveTo(ox,oy); pts.forEach(p=>g.lineTo(p[0],p[1])); g.lineTo(ox+w,oy); g.closePath(); g.fill(); g.stroke(); }
      txt(`${R.name}  ·  32 SEGMENTS  ·  ${R.rate} HZ  ·  ${R.bits} BIT`,1,2); } break;
  case 'R': header('RHYTHM SEQUENCER'); { txt(`PATTERN ${'ABCD'[SEQ.pat]}   TEMPO ${SEQ.tempo}   ${clk.running?'PLAYING':'STOPPED'}`,1,2);
      txt('[PLAY]',50,2,'#c4ffe4'); hit(10+50*CW-4,14+2*LH-10,60,20,()=>{ VS.ensure(); clk.bpm=SEQ.tempo; clk.toggle(); playK.classList.toggle('lit',clk.running); draw(); });
      ['A','B','C','D'].forEach((p,i)=>{ txt(p,62+i*3,2,i===SEQ.pat?'#e2fff2':GD); hit(10+(62+i*3)*CW-4,14+2*LH-10,20,20,()=>{ SEQ.pat=i; draw(); }); });
      const P=SEQ.pats[SEQ.pat], gx=170, gy=72, cw=30, rh=27;
      for(let s=0;s<16;s++) txt(String(s+1).padStart(2),(gx+s*cw+6)/CW-1.15,3.2,s===SEQ.step?'#e2fff2':GD);
      for(let r=0;r<8;r++){ const y=gy+r*rh; txt(`${r+1} ${regs[r].name.padEnd(7)}`,0.2,(y+12-14)/LH+.05,r===cur?'#c4ffe4':GR); txt(VS.noteName(SEQ.note[r]).toUpperCase().padStart(4),12.6,(y+12-14)/LH+.05,GD);
        hit(10,y,100,rh-4,()=>{ cur=r; keysUi(); draw(); });
        let ny=null,n0=0; hit(118,y,46,rh-4,(x,yy,first)=>{ if(first){ ny=yy; n0=SEQ.note[r]; return; } const nn=VS.clamp(Math.round(n0+(ny-yy)/4),24,96); if(nn!==SEQ.note[r]){ SEQ.note[r]=nn; save(); draw(); } },true);
        for(let s=0;s<16;s++){ const x=gx+s*cw, v=P[r][s]; g.strokeStyle=s===SEQ.step?GR:GD; g.strokeRect(x+.5,y+.5,cw-6,rh-8); if(v){ g.fillStyle=v===2?'#e2fff2':GR; g.fillRect(x+4,y+4,cw-13,rh-15); }
          hit(x,y,cw-4,rh-6,()=>{ P[r][s]=(P[r][s]+1)%3; save(); draw(); }); } }
      txt('TOUCH STEP: ON / ACCENT / OFF  ·  DRAG NOTE UP/DOWN  ·  ▲▼ TEMPO',1,19.6,GD); } break; }
  footer(); g.shadowBlur=0; }
setInterval(()=>{ if(!document.hidden) draw(); },500);
function computeHarm(){ const n=256, cyc=new Float32Array(n); for(let i=0;i<n;i++){ let s=0; for(let h=0;h<32;h++) if(harm[h]) s+=harm[h]*Math.sin(2*Math.PI*(h+1)*i/n); cyc[i]=s; } loadCycle(cyc,'HARMON'); }
function computeDraw(){ loadCycle(drawBuf.slice(),'DRAWN'); }
function loadCycle(cyc,name){ let m=0; for(const x of cyc) m=Math.max(m,Math.abs(x)); const n=cyc.length, rate=Math.round(261.63*n), L=n*32, raw=new Float32Array(L); for(let i=0;i<L;i++) raw[i]=cyc[i%n]/(m||1)*.95;
  const R=regs[cur]; Object.assign(R,{name:name+(cur+1),src:'draw',raw,rate,bits:8,ls0:n*8,le0:L,base:60}); R.p.loop=1; R.p.sus=1; renderReg(cur); save(); msg(`COMPUTED INTO VOICE ${cur+1}`); }
/* light pen */
let penHit=null; const penPos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*712,(e.clientY-r.top)/r.height*364]; };
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); e.stopPropagation(); VS.ensure(); const [x,y]=penPos(e); for(let i=hits.length-1;i>=0;i--){ const h=hits[i]; if(x>=h.x&&x<=h.x+h.w&&y>=h.y&&y<=h.y+h.h){ penHit=h.drag?h:null; try{cv.setPointerCapture(e.pointerId)}catch(_){} h.f(x,y,true); return; } } });
cv.addEventListener('pointermove',e=>{ if(!penHit) return; const [x,y]=penPos(e); penHit.f(x,y,false); });
const penUp=()=>{ penHit=null; }; cv.addEventListener('pointerup',penUp); cv.addEventListener('pointercancel',penUp);
addEventListener('keydown',e=>{ if(e.key==='Enter'){ exec(); e.preventDefault(); } else if(e.key==='Backspace'){ cmd=cmd.slice(0,-1); draw(); e.preventDefault(); } else if(e.key==='ArrowUp'){ adj(1); e.preventDefault(); } else if(e.key==='ArrowDown'){ adj(-1); e.preventDefault(); } else if(e.code==='Space'&&!e.repeat){ e.preventDefault(); VS.ensure(); clk.bpm=SEQ.tempo; clk.toggle(); playK.classList.toggle('lit',clk.running); } });
/* ---------- boot ---------- */
PRE.forEach(([r,l])=>mkReg(r,l)); regs[1].p.attack=30; regs[1].p.damp=60; regs[2].p.vibD=8; regs[3].p.attack=20; regs[4].p.damp=70; regs[4].p.sus=0;
try{ const s=JSON.parse(localStorage.getItem(LS)); if(s&&s.seq){ Object.assign(SEQ,s.seq); clk.bpm=SEQ.tempo; } if(s&&s.regs&&s.regs.length===8) s.regs.forEach((o,i)=>{ const R=regs[i]; if(o.src==='lib'){ Object.assign(R,{name:SMP.LIB[o.lib][0],key:SMP.LIB[o.lib][1],lib:o.lib,src:'lib',rate:o.rate,bits:o.bits}); } else if(o.raw){ Object.assign(R,{name:o.name,src:'draw',raw:new Float32Array(o.raw),rate:o.rate,bits:o.bits,ls0:o.ls0,le0:o.le0}); }
  Object.assign(R.p,o.p); R.kbd=o.kbd; R.trans=o.trans; R.loopSet=true; renderReg(i); }); }catch(e){ console.warn(e); }
VS.fit(panel,W,H); go('R');
window.CMI={noteOn,noteOff,go,regs,SEQ,clk,seqMidi,loadLib,computeDraw,computeHarm,get cur(){return cur},set cur(v){cur=v;},drawBuf,harm,get page(){return page},hits,cv,adj,PARS};
