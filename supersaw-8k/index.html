  let dots=''; for(let i=0;i<=20;i++){ const a=(-135+13.5*i)*Math.PI/180, rr=26.5, big=i===10?1.7:(i===0||i===20)?1.3:0.95;
    dots+=`<circle cx="${(R+Math.sin(a)*rr).toFixed(2)}" cy="${(R-Math.cos(a)*rr).toFixed(2)}" r="${big}" fill="#e9ecf2"/>`; }
  e.innerHTML=`<svg width="${2*R}" height="${2*R}" style="display:block;overflow:visible">${dots}
    <circle cx="${R}" cy="${R+2}" r="19.5" fill="#0008"/><circle cx="${R}" cy="${R}" r="19.5" fill="url(#ksk)" stroke="#000" stroke-width="1"/>
    <g class="rot" style="transform-origin:${R}px ${R}px"><circle cx="${R}" cy="${R}" r="11.2" fill="url(#kcap)" stroke="#3b3e44" stroke-width=".8"/>
    <rect x="${R-1.2}" y="${R-11.2}" width="2.4" height="8.2" rx="1" fill="#0b0c0e"/></g></svg>`;
  const rot=e.querySelector('.rot'); if(label) T(label,x,ly??(y-32));
  const render=()=>{ rot.style.transform=`rotate(${-135+270*(getV(k)-S[1])/(S[2]-S[1])}deg)`; };
  drag(e,k,1/170); CTL[k]={render}; render(); return e;
}
/* slider: black slot, black cap with a light centre line, white tick marks on the right */
function slider(k,x,y0=175,y1=266,label,ly){
  const len=y1-y0, e=mk('sld',x-18,y0-10,40,len+20), S=SPEC[k];
  const sl=mk('',14,8,8,len+4,e); sl.style.cssText+=';background:#020203;border-radius:2px;box-shadow:0 0 0 1px #ffffff14';
  for(let i=0;i<=10;i++){ const t=mk('',30,10+(len-4)*i/10+2,6,1.6,e); t.style.background='#e8ebf0'; }
  const cap=mk('',3,0,30,19,e); cap.style.cssText+=';background:linear-gradient(#2c2e33,#0e0f11 35%,#1d1f23 46%,#9fa3aa 50%,#1d1f23 54%,#0b0c0e 70%,#25272b);border-radius:2px;border:1px solid #000;box-shadow:0 3px 3px #000b';
  if(label) T(label,x,ly??(y0-12));
  const render=()=>{ cap.style.top=(len*(1-(getV(k)-S[1])/(S[2]-S[1]))+0.5)+'px'; };
  drag(e,k,1/len); CTL[k]={render}; render(); return e;
}
/* rubber button (optionally with a red LED bar inside) */
function btn(x0,y0,x1,y1,fn,{bar=false}={}){
  const b=box('btn',x0,y0,x1,y1); let lb=null; if(bar) lb=mk('bar',null,null,null,null,b);
  b.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ev.stopPropagation(); b.classList.add('press'); fn(ev); });
  const rel=()=>b.classList.remove('press'); b.addEventListener('pointerup',rel); b.addEventListener('pointerleave',rel); b.addEventListener('pointercancel',rel);
  b.bar=lb; return b;
}

function envG(x0,x1,y,segs){

  const peak=2, sus=6;
  if(n===2) p+=`L${w/2} ${peak} L${w} 14`; else p+=`L${w/4} ${peak} L${w/2} ${sus} L${w*3/4} ${sus} L${w} 14`;
  let s=`<path d="${p}" fill="none" stroke="#eef0f4" stroke-width="1.3"/><line x1="0" y1="14" x2="${w}" y2="14" stroke="#eef0f4" stroke-width="1.2"/>
    <path d="M${w-5} 11 L${w} 14 L${w-5} 17" fill="none" stroke="#eef0f4" stroke-width="1.2"/>`;
  for(let i=1;i<n;i++) s+=`<line x1="${xs[i]}" y1="${n===2?peak:i===1?peak:sus}" x2="${xs[i]}" y2="16" stroke="#eef0f4" stroke-width="1"/>`;
  svgAt(x0,y-14,w,18,s);
  segs.forEach((t,i)=>{ const l=T(t,x0+xs[i]+w/n/2,y-1,'s'); l.style.background='#27395c'; l.style.padding='0 2px'; });
}

  else { lcdTop=SPEC[k][0]; lcdBot='= '+fmtV(k,getV(k)); }
  clearTimeout(idleT); drawLcd(); }

  if(lastKey&&lastShown&&performance.now()-lastShown<2500){ setV(lastKey,getV(lastKey)+d); return; }
  loadPatch(G.num,d>0?1:0); }
let lastShown=0;

  return lcdMode?['PATCH '+b+':'+part,names[G.panel]]:['PERFORM '+b+part,names[0]+(G.keyMode?' / '+names[1]:'')]; }

/* vsynths note protocol v1 · receiver (shared, paste once per synth, then call VSN.use({...}) with the synth's own note functions)
   messages in : {type:'vsynths:hello'}                                   -> answers {type:'vsynths:ready', proto:1, slug, notes:true}
                 {type:'vsynths:note', note, vel, on, dur, delay, at, src}  note: midi 0-127 or [notes]; vel 0-1 (or 1-127); on: true|false (default true)
                                                                            dur: s (on + auto off); delay: s from now, or at: epoch ms (performance.timeOrigin+performance.now())
                 {type:'vsynths:notes', list:[...note msgs]}               batch
                 {type:'vsynths:panic'} / {type:'vsynths:stop'}            release every note this protocol holds (the synth's own stop handler still runs for :stop)
   messages out: {type:'vsynths:ready', ...} once VSN.use() runs and on every hello; {type:'vsynths:ack', on, off} on {type:'vsynths:stats'} */
(function (W) {
  if (W.VSN) return;
  const A = { on: null, off: null, panic: null, slug: '' }, live = new Map(), timers = new Set(), st = { on: 0, off: 0, msgs: 0 };
  const slugOf = () => A.slug || (location.pathname.split('/').filter(s => s && !/\.html?$/.test(s)).pop() || document.title || 'synth').toLowerCase();
  const nowMs = () => (performance.timeOrigin || 0) + performance.now();
  const ready = to => { const m = { type: 'vsynths:ready', proto: 1, slug: slugOf(), notes: !!A.on }; try { (to || (W.parent !== W ? W.parent : null)) && (to || W.parent).postMessage(m, '*'); } catch (e) {} };
  const later = (ms, f) => { if (ms <= 2) return f(); const id = setTimeout(() => { timers.delete(id); f(); }, ms); timers.add(id); };
  const v01 = v => { v = +v; if (!isFinite(v)) return 0.8; if (v > 1) v /= 127; return Math.max(0.01, Math.min(1, v)); };
  function on(n, v) { const c = live.get(n) || 0; try { if (c) A.off(n); A.on(n, v); } catch (e) {} live.set(n, c + 1); st.on++; }
  function off(n) { const c = live.get(n) || 0; if (!c) return; if (c > 1) { live.set(n, c - 1); return; } live.delete(n); try { A.off(n); } catch (e) {} st.off++; }
  function releaseAll() { timers.forEach(clearTimeout); timers.clear(); for (const n of [...live.keys()]) { live.set(n, 1); off(n); } try { A.panic && A.panic(); } catch (e) {} }
  function note(d) {
    if (!A.on) return; const ns = Array.isArray(d.note) ? d.note : [d.note], v = v01(d.vel == null ? 0.8 : d.vel);
    const ms = d.at != null ? d.at - nowMs() : (+d.delay || 0) * 1000; if (ms < -250) return; // stale (tab was asleep): drop instead of a burst
    const isOn = d.on !== false, dur = +d.dur > 0 ? Math.min(+d.dur, 30) : 0;
    for (const n0 of ns) { const n = Math.round(+n0); if (!(n >= 0 && n <= 127)) continue;
      if (!isOn) { later(ms, () => off(n)); continue; }
      later(ms, () => on(n, v)); if (dur) later(ms + dur * 1000, () => off(n)); }
  }
  W.addEventListener('message', e => { const d = e.data; if (!d || typeof d !== 'object' || typeof d.type !== 'string' || d.type.slice(0, 8) !== 'vsynths:') return;
    st.msgs++;
    if (d.type === 'vsynths:note') note(d);
    else if (d.type === 'vsynths:notes' && Array.isArray(d.list)) d.list.forEach(note);
    else if (d.type === 'vsynths:panic' || d.type === 'vsynths:stop') releaseAll();
    else if (d.type === 'vsynths:hello') ready(e.source);
    else if (d.type === 'vsynths:stats') { try { e.source.postMessage({ type: 'vsynths:ack', slug: slugOf(), on: st.on, off: st.off, held: live.size }, '*'); } catch (x) {} } });
  W.VSN = { use(o) { Object.assign(A, o); ready(); return W.VSN; }, stats: () => Object.assign({ held: live.size }, st), releaseAll, proto: 1 };
})(typeof window !== 'undefined' ? window : this);
