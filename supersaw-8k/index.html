/* ---- bottom: bend/mod lever, ribbon, keyboard ---- */
const KY=490;
sec('BEND / MOD',10,R2+R2H+10,140,H-R2-R2H-20);
const lever=mk('',30,KY-20,100,100); lever.id='lever'; const lvH=mk('',41,41,18,18,lever); lvH.id='lvH';

let lvId=null;
function lvSend(x,y){ for(const p of [0,1]){ post({type:'p',part:p,k:'bend',v:x}); post({type:'p',part:p,k:'mod',v:y}); } }
function lvMove(ev){ const r=lever.getBoundingClientRect(), x=clamp((ev.clientX-r.left)/r.width*2-1,-1,1), y=clamp(1-(ev.clientY-r.top)/r.height*2,-1,1);
  lvH.style.left=(41+x*40)+'px'; lvH.style.top=(41-y*40)+'px'; lvSend(x,Math.max(0,y)); }
lever.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ensureAudio(); lvId=ev.pointerId; try{lever.setPointerCapture(ev.pointerId);}catch(_){} lvMove(ev); });
lever.addEventListener('pointermove',ev=>{ if(ev.pointerId===lvId){ ev.preventDefault(); lvMove(ev); } });
const lvUp=ev=>{ if(ev.pointerId!==lvId) return; lvId=null; lvH.style.left='41px'; lvH.style.top='41px'; lvSend(0,0); };
lever.addEventListener('pointerup',lvUp); lever.addEventListener('pointercancel',lvUp);
const KX=160, KW=W-KX-10;
const ribbon=mk('',KX,KY-32,KW,24); ribbon.id='ribbon'; { const t=T('RIBBON CONTROLLER',KW/2,12,'s',ribbon); t.style.color='#4b5560'; t.style.pointerEvents='none'; } const rbDot=mk('',0,1,6,20,ribbon); rbDot.id='rbDot';
let rbId=null;
function rbSend(v){ for(const p of [0,1]){ post({type:'p',part:p,k:'cutMod',v:G.rbAsn===0?v:0}); post({type:'p',part:p,k:'pitchMod',v:G.rbAsn===1?v*12:0}); post({type:'p',part:p,k:'xmodAdd',v:G.rbAsn===2?Math.max(0,v):0}); } }
function rbMove(ev){ const r=ribbon.getBoundingClientRect(), f=clamp((ev.clientX-r.left)/r.width,0,1); rbDot.style.left=(f*(KW-8))+'px'; rbDot.style.opacity=1; rbSend(f*2-1); }
ribbon.addEventListener('pointerdown',ev=>{ ev.preventDefault(); ensureAudio(); rbId=ev.pointerId; try{ribbon.setPointerCapture(ev.pointerId);}catch(_){} rbMove(ev); });
ribbon.addEventListener('pointermove',ev=>{ if(ev.pointerId===rbId){ ev.preventDefault(); rbMove(ev); } });
const rbUp=ev=>{ if(ev.pointerId!==rbId) return; rbId=null; rbDot.style.opacity=0; rbSend(0); }; ribbon.addEventListener('pointerup',rbUp); ribbon.addEventListener('pointercancel',rbUp);
/* keyboard: 3 octaves + top C (C3..C6 at octave shift 0), multi-touch, glide across keys, velocity from where you touch */
const kbd=[], BASE=48, NW=22, WKW=KW/NW, KH=H-KY-10;
const isBlack=n=>[1,3,6,8,10].includes(n%12);
let wi=0; for(let n=BASE;n<=BASE+36;n++){ if(!isBlack(n)){ const e=mk('wk',KX+wi*WKW,KY,WKW+1,KH); e.dataset.n=n; kbd.push({n,el:e}); wi++; } }
wi=0; for(let n=BASE;n<=BASE+36;n++){ if(isBlack(n)){ const e=mk('bk',KX+wi*WKW-WKW*0.32,KY,WKW*0.64,KH*0.6); e.dataset.n=n; kbd.push({n,el:e}); } else wi++; }
for(let i=0;i<4;i++){ const t=T('C'+(3+i),KX+i*7*WKW+WKW/2,H-22,'s'); t.style.color='#666'; t.style.pointerEvents='none'; }
const touchNote=new Map();
function keyAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.dataset&&el.dataset.n?el:null; }
function velAt(el,y){ const r=el.getBoundingClientRect(); return clamp(0.35+0.65*(y-r.top)/r.height,0.2,1); }
panel.addEventListener('pointerdown',ev=>{ const el=keyAt(ev.clientX,ev.clientY); if(!el) return; ev.preventDefault(); try{panel.setPointerCapture(ev.pointerId);}catch(_){}
  const n=+el.dataset.n+12*G.oct; touchNote.set(ev.pointerId,n); noteDown(n,velAt(el,ev.clientY)); });
panel.addEventListener('pointermove',ev=>{ if(!touchNote.has(ev.pointerId)) return; ev.preventDefault(); const el=keyAt(ev.clientX,ev.clientY); if(!el) return;
  const n=+el.dataset.n+12*G.oct, o=touchNote.get(ev.pointerId); if(n!==o){ noteUp(o); touchNote.set(ev.pointerId,n); noteDown(n,velAt(el,ev.clientY)); } });
const kUp=ev=>{ if(!touchNote.has(ev.pointerId)) return; noteUp(touchNote.get(ev.pointerId)); touchNote.delete(ev.pointerId); };
panel.addEventListener('pointerup',kUp); panel.addEventListener('pointercancel',kUp);
panel.addEventListener('contextmenu',e=>e.preventDefault());
panel.addEventListener('touchmove',e=>e.preventDefault(),{passive:false}); // panel only: no page scroll/zoom while playing; the host page is untouched
function refreshKeys(){ const on=new Set([...held].map(n=>n-12*G.oct)); for(const k of kbd) k.el.classList.toggle('dn',on.has(k.n)); }

/* ---- computer keyboard: a w s e d f t g y h u j k = C..C, z/x octave, space run/stop, esc stop all ---- */
const KMAP={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12};
const kDown=new Map();
addEventListener('keydown',e=>{ if(e.metaKey||e.ctrlKey||e.altKey) return; const c=e.code;
  if(c in KMAP){ e.preventDefault(); if(e.repeat||kDown.has(c)) return; const n=60+KMAP[c]+12*G.oct; kDown.set(c,n); noteDown(n,0.85); }
  else if(c==='KeyZ') setV('oct',G.oct-1); else if(c==='KeyX') setV('oct',G.oct+1);
  else if(c==='Space'){ e.preventDefault(); if(!e.repeat) arpToggleRun(); }
  else if(c==='Escape') stopAll(); });
addEventListener('keyup',e=>{ const c=e.code; if(kDown.has(c)){ noteUp(kDown.get(c)); kDown.delete(c); } });
addEventListener('blur',()=>{ for(const [,n] of kDown) noteUp(n); kDown.clear(); });

/* =============== display / refresh =============== */
let lcdTop='A1 SUPERSAW LEAD', lcdBot='';
function showParam(k){ if(k) lcdBot=SPEC[k][0].slice(0,16).padEnd(17)+fmtV(k,getV(k)); drawLcd(); }
function flash(m){ lcdBot=m; drawLcd(); }
function drawLcd(){ const tag=G.keyMode?(G.panel?' LO':' UP'):''; lcd.textContent=(lcdTop.slice(0,25-tag.length).padEnd(25-tag.length)+tag)+'\n'+lcdBot.slice(0,25); }
function renderAll(){ for(const k in CTL) CTL[k].render(); }
function refresh(){
  arpL.classList.toggle('on',!!G.arpOn); runL.classList.toggle('on',!!(arpRun||arpTimer)); recL.classList.toggle('on',motion.rec); mpL.classList.toggle('on',motion.play);
  numL.forEach((l,i)=>l.classList.toggle('on',i===G.num)); midiL.classList.toggle('on',midiOn); octL.textContent=(G.oct>0?'+':'')+G.oct;
  nb0.textContent=names[0].slice(0,16); nb1.textContent=G.keyMode?names[1].slice(0,16):'—';
  renderAll(); drawLcd(); refreshKeys();
}
(function loop(){
  if(ctx&&arpVis.length){ const now=ctx.currentTime-(ctx.outputLatency||0); while(arpVis.length&&arpVis[0].t<=now){ arpCur=arpVis.shift().k; arpL.classList.toggle('on',arpCur%2===0); } }
  meterRecent*=0.92; mlvb.style.width=Math.min(34,34*Math.sqrt(meterRecent/0.94))+'px';
  requestAnimationFrame(loop);
})();

/* =============== fit to the viewport (inside an iframe this is the frame's own viewport) =============== */
function fit(){ const vv=window.visualViewport, vw=(vv?vv.width:innerWidth), rot=document.getElementById('rot'), rh=rot.offsetHeight?rot.offsetHeight+12:0, vh=(vv?vv.height:innerHeight)-rh;
  const m=vw<1000?4:20, s=Math.max(0.1,Math.min((vw-m)/W,(vh-m)/H)); panelScale=s; panel.style.transform=`scale(${s})`; const st=document.getElementById('stage'); st.style.width=W*s+'px'; st.style.height=H*s+'px'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,250)); if(window.visualViewport) visualViewport.addEventListener('resize',fit); fit();

/* =============== persistence (silently skipped when storage is blocked, e.g. sandboxed iframes) =============== */
let saveT=0; function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(LS,JSON.stringify({G:{...G,arpOn:0,arpHold:0},PARTS,FX,USER,names,motion:motion.sets})); }catch(e){} },300); }
let restored=false;
try{ const o=JSON.parse(localStorage.getItem(LS)||'null'); if(o&&o.PARTS&&o.PARTS.length===2){ Object.assign(G,o.G||{}); o.PARTS.forEach((p,i)=>PARTS[i]=Object.assign(defPatch(),p)); FX=Object.assign(defFx(),o.FX||{});
  if(Array.isArray(o.USER)&&o.USER.length===8) USER=o.USER; if(Array.isArray(o.names)) names=o.names; if(Array.isArray(o.motion)) motion.sets=o.motion; restored=true; lcdTop=(G.bank?'B':'A')+(G.num+1)+' '+names[G.panel]; } }catch(e){}
if(!restored){ G.panel=1; loadPatch(2,0); G.panel=0; loadPatch(0,0); }
showParam(lastKey); refresh();
window.VS8K={G,PARTS,get FX(){return FX;},SPEC,setV,getV,noteDown,noteUp,loadPatch,buildMidi,exportMidi,arpToggleRun,stopAll,ensureAudio,
  get ready(){return ready;},get ctx(){return ctx;},meter:()=>({peak:meterPk,nan:meterNan}),resetMeter:()=>{meterPk=0;meterNan=0;},get worklet(){return !!(node&&node.port);},motion,PRESETS,get arpRunning(){return !!arpTimer;}};
