  const notes=V.exportNotes?V.exportNotes(T,steps):(()=>{ const out=[]; let last=null; for(let k=0;k<steps;k++){ const s=V.seq[k%16], prev=V.seq[(k+15)%16];
      if(!s.on){ last=null; continue; } const en=s.s?(k+1)*T+6:k*T+13;
      if(last&&prev.on&&prev.s&&V.mono&&last.p===s.n){ last.en=en; continue; } out.push(last={p:s.n,st:k*T,en:Math.min(en,total),v:s.a?127:92}); } return out; })();
  for(const n of notes){ ev.push([n.st,1,n]); ev.push([n.en,0,n]); } ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const d=[0,0xFF,3,name.length,...[...name].map(c=>c.charCodeAt(0))]; const us=Math.round(6e7/V.bpm); d.push(0,0xFF,0x51,3,us>>16&255,us>>8&255,us&255,0,0xFF,0x58,4,4,2,24,8);
  let now=0; for(const [t,on,n] of ev){ d.push(...vlq(t-now)); now=t; d.push(on?0x90:0x80,n.p&127,on?n.v:64); } d.push(...vlq(Math.max(0,total-now)),0xFF,0x2F,0);

V.exportMidi=function(){ const nm=(V.id+'_'+(V.presetName||'patch')).replace(/[^A-Za-z0-9]+/g,'_').toLowerCase()+'_'+V.bpm+'bpm.mid';
  const blob=new Blob([V.buildMidi(V.title)],{type:'audio/midi'}); const iOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nm; a.rel='noopener'; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000); V.flash('MIDI EXPORTED'); };

V.strip=function(y,h=64,o={}){ const s=V.el('xs',0,y,W,h); const by=y+(h-30)/2; let x=14;

  V.txt('VACID',x+22,h/2,15,'#ff6a3a',{parent:s,ls:'.12em'}); x+=50;
  B('◀',30,()=>V.loadPreset(V.presetIdx-1)); const pl=V.el('',x,(h-30)/2,200,30,s,'background:#05140c;border:1px solid #000;border-radius:3px;color:#7dffb0;font:700 13px Arial;display:flex;align-items:center;padding-left:8px;overflow:hidden;white-space:nowrap');

  V.octLbl=B('OCT 0',58,(b,ev)=>{ const r=b.getBoundingClientRect(); V.setOct(V.oct+((ev.clientX-r.left)<r.width/2?-1:1)); });

  bl.textContent=V.bpm+' BPM'; return s; };
V.drawSeq=function(){ if(!V.stepEls) return; V.stepEls.forEach((e,i)=>{ const s=V.seq[i]; e.className='st'+(s.on?' on':'')+(s.on&&s.a?' a':'')+(s.on&&s.s?' sl':'')+(i===V.seqPos?' cur':'')+(V.rec&&i===V.recPos?' rc':'');
  e.title=s.on?('note '+s.n):''; }); if(V.runBtn) V.runBtn.classList.toggle('on',V.seqRun); if(V.bpmLbl) V.bpmLbl.textContent=V.bpm+' BPM'; };
V.help=function(){ const h=document.getElementById('vhelp'); h.innerHTML=`<h2>${V.title}</h2>${V.helpText||''}<p><b>Playing:</b> on-screen keys (slide across them), the computer keyboard (A W S E D F T G Y H U J K = one octave, − / = change octave), or a MIDI keyboard (Web MIDI, Chrome / Edge desktop).</p>
<p><b>Sequencer strip:</b> RUN (or Space) plays 16 steps at the BPM. Tap a step to switch it on with the last note you played, tap again for off. Shift-click = accent, long-press = slide. REC: play keys to fill steps one by one (tap a step to move the cursor). RAND makes a psy line in the key of the last note. MIDI ⇩ exports 4 bars as a .mid file for Ableton (on iPhone it opens the share sheet).</p>
<p><b>Knobs/sliders:</b> drag up/down, scroll wheel, double-click to reset. ◀ ▶ step through the presets. Your edits are saved in this browser.</p><p style="opacity:.6">Tap anywhere to close.</p>`;

V.save=function(){ try{ localStorage.setItem('vsynths.'+V.id,JSON.stringify({P:V.P,seq:V.seq,bpm:V.bpm,pi:V.presetIdx,x:V.saveExtra?V.saveExtra():null})); }catch(e){} };
V.restore=function(){ try{ const o=JSON.parse(localStorage.getItem('vsynths.'+V.id)); if(!o) return false; Object.assign(V.P,o.P); if(Array.isArray(o.seq)&&o.seq.length===16) V.seq=o.seq; if(o.bpm) V.bpm=o.bpm;
