.wood{background:linear-gradient(90deg,#2a160a,#6b3b1b 35%,#4a2711 70%,#2a160a)}

/* ---- shared 6-voice DCO poly engine (used by the JU-6 and JU-106 panels) ---- */

function JVoice(c,out){ const v={note:60,active:false,age:0};

  v.pp=V.pwmPulse(v.saw); v.pulseG=V.gain(0); v.pp.out.connect(v.pulseG);
  v.sub=V.osc('square'); v.subG=V.gain(0); v.sub.connect(v.subG);

  v.mix.connect(v.ls); v.ls.connect(v.hp); v.f=V.ladder(); v.hp.connect(v.f.in); v.vca=V.gain(0); v.f.out.connect(v.vca); v.vca.connect(out);
  v.env=V.cs(0); v.envF=V.gain(0); v.env.connect(v.envF); v.envF.connect(v.f.cv); v.envP=V.gain(0); v.env.connect(v.envP); v.envP.connect(v.pp.mod);
  v.lfoD=V.gain(0); JE.lfo.connect(v.lfoD); v.lfoP=V.gain(0); v.lfoF=V.gain(0); v.lfoW=V.gain(0); v.lfoD.connect(v.lfoP); v.lfoD.connect(v.lfoF); v.lfoD.connect(v.lfoW);

    const h=jHpf(P.hpf); v.hp.frequency.setTargetAtTime(h.f,t,0.01); v.ls.gain.setTargetAtTime(h.boost,t,0.01);

    v.lfoP.gain.setTargetAtTime(P.dcolfo/10*P.dcolfo/10*700,t,0.01); v.lfoF.gain.setTargetAtTime(P.vcflfo/10*3600,t,0.01); };
  v.on=function(n,vel,t){ const P=V.P; v.note=n; v.porta=JE.porta?JE.porta():0.0005; v.set(t); const a=jT(P.a),d=jT(P.d),s=P.s/10;
