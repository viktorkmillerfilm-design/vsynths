<script type="text/plain" id="dspsrc">// wavetable synth engine: 3 wavetable osc (unison) + mod osc + noise + feedback -> 2 filters (serial/parallel) -> amp -> inserts -> master fx
const TN=2048, NF=16, MIPS=[512,256,128,64,32,16,8,4];
function fft(re,im,inv){ const n=re.length; for(let i=1,j=0;i<n;i++){ let b=n>>1; for(;j&b;b>>=1) j^=b; j^=b; if(i<j){ let t=re[i];re[i]=re[j];re[j]=t; t=im[i];im[i]=im[j];im[j]=t; } }
  for(let len=2;len<=n;len<<=1){ const a=(inv?2:-2)*Math.PI/len, wr=Math.cos(a), wi=Math.sin(a); for(let i=0;i<n;i+=len){ let cr=1,ci=0; for(let j=0;j<len/2;j++){ const ur=re[i+j],ui=im[i+j], k=i+j+len/2, vr=re[k]*cr-im[k]*ci, vi=re[k]*ci+im[k]*cr;
    re[i+j]=ur+vr; im[i+j]=ui+vi; re[k]=ur-vr; im[k]=ui-vi; const t=cr*wr-ci*wi; ci=cr*wi+ci*wr; cr=t; } } } }
const rnd=s=>()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
const TABLES=[ // [name, generator(frame 0..1, x 0..1) -> sample]   (time-domain, then band-limited per mip)
 ['basic shapes',(f,x)=>{ const s=Math.sin(2*Math.PI*x), tri=1-4*Math.abs(((x+.25)%1)-.5), saw=1-2*x, sq=x<.5?1:-1; const k=f*3, i=Math.floor(k), t=k-i; const W=[s,tri,saw,sq,sq]; return W[i]*(1-t)+W[i+1]*t; }],
 ['squ-saw',(f,x)=>{ const saw=1-2*x, sq=x<.5?1:-1; return saw*(1-f)+sq*f*.8+Math.sin(4*Math.PI*x)*.3*Math.sin(Math.PI*f); }],
 ['pulse width',(f,x)=>{ const w=.5-f*.46; return (x<w?1:-1)-(1-2*w)*-1*0; }],
 ['hard sync',(f,x)=>{ const r=1+f*7; return 1-2*((x*r)%1); }],
 ['vowel',(f,x)=>{ const V=[[730,1090,2440],[530,1840,2480],[270,2290,3010],[570,840,2410],[300,870,2240]], k=f*4,i=Math.min(3,Math.floor(k)),t=k-i; const F=V[i].map((a,j)=>a*(1-t)+V[i+1][j]*t); let s=0; for(let h=1;h<=40;h++){ const fr=h*110; let a=0; F.forEach((c,j)=>a+=Math.exp(-Math.pow((fr-c)/(90+j*40),2))*(j?0.5:1)); s+=a*Math.sin(2*Math.PI*h*x)/Math.sqrt(h); } return s; }],
 ['harmonic sweep',(f,x)=>{ const h=1+f*31; const h0=Math.floor(h), t=h-h0; return Math.sin(2*Math.PI*x)*.6+Math.sin(2*Math.PI*h0*x)*(1-t)+Math.sin(2*Math.PI*(h0+1)*x)*t; }],
 ['growl',(f,x)=>{ let s=0; for(let h=1;h<=48;h+=1){ const c=3+f*20; const a=(h%2?1:.4)*Math.exp(-Math.pow((h-c)/(3+f*4),2))+(h===1?.6:0); s+=a*Math.sin(2*Math.PI*h*x+h*f*2); } return s; }],
 ['digital',(f,x)=>{ const R=rnd(77+Math.floor(f*15)*13); let s=0; for(let h=1;h<=64;h++){ const a=R()<.25?R()/Math.pow(h,.4):0; s+=a*Math.sin(2*Math.PI*h*x+R()*6); } return s+Math.sin(2*Math.PI*x)*.4; }],
 ['metal',(f,x)=>{ let s=0; for(let h=1;h<=60;h++){ const a=Math.pow(Math.abs(Math.sin(h*(1.7+f*2.3))),6)/Math.sqrt(h); s+=a*Math.sin(2*Math.PI*h*x); } return s; }],
 ['fm stack',(f,x)=>Math.sin(2*Math.PI*x+ (f*6)*Math.sin(2*Math.PI*2*x)+f*2*Math.sin(2*Math.PI*5*x))],
];
function buildTables(){ const out=[]; const re=new Float64Array(TN), im=new Float64Array(TN), r2=new Float64Array(TN), i2=new Float64Array(TN);
  for(const [nm,g] of TABLES){ const T=[]; for(let fi=0;fi<NF;fi++){ const f=fi/(NF-1); for(let i=0;i<TN;i++){ re[i]=g(f,i/TN); im[i]=0; } let m=0; for(let i=0;i<TN;i++) m+=re[i]; m/=TN; for(let i=0;i<TN;i++) re[i]-=m;
      fft(re,im,false); const lev=[]; let norm=0;
      for(let li=0;li<MIPS.length;li++){ const lim=MIPS[li]; r2.fill(0); i2.fill(0); for(let h=1;h<=lim&&h<TN/2;h++){ r2[h]=re[h]; i2[h]=im[h]; r2[TN-h]=re[TN-h]; i2[TN-h]=im[TN-h]; } r2[0]=0;
        fft(r2,i2,true); const a=new Float32Array(TN+1); for(let i=0;i<TN;i++) a[i]=r2[i]/TN; a[TN]=a[0]; if(li===0){ for(let i=0;i<TN;i++) norm=Math.max(norm,Math.abs(a[i])); } lev.push(a); }
      const k=norm>1e-9?1/norm:1; lev.forEach(a=>{ for(let i=0;i<=TN;i++) a[i]*=k; }); T.push(lev); } out.push(T); } return out; }
class SVF{ constructor(){ this.a=0;this.b=0;this.c=0;this.d=0; } // two TPT stages
  run(x,g,k,type){ const a1=1/(1+g*(g+k)); const w1=a1*this.a+g*a1*(x-this.b), w2=this.b+g*w1; this.a=2*w1-this.a; this.b=2*w2-this.b; if(type===0) return w2; if(type===1) return w1; if(type===2) return x-k*w1-w2; return x-k*w1; }
  run2(x,g,k,type){ const a1=1/(1+g*(g+k)); const w1=a1*this.c+g*a1*(x-this.d), w2=this.d+g*w1; this.c=2*w1-this.c; this.d=2*w2-this.d; if(type===0) return w2; if(type===1) return w1; if(type===2) return x-k*w1-w2; return x-k*w1; } }
class Filt{ constructor(sr){ this.sr=sr; this.s=new SVF(); this.cb=new Float32Array(4096); this.ci=0; this.y=0; }
  run(x,type,cut,res,drv){ // cut 0..1 (20Hz..20k exp), res 0..1, drv 0..1
    const fc=Math.min(this.sr*.45,20*Math.pow(1000,cut)); const g=Math.tan(Math.PI*fc/this.sr);
    switch(type){ case 0: return x;
     case 1: return this.s.run(x*(1+drv*2),g,2-res*1.96,0)/(1+drv);                       // lowpass 2
     case 2: { const k=2-res*1.98; let y=this.s.run(x,g,Math.max(.03,k*.7+.3),0); return this.s.run2(Math.tanh(y*(1+drv*3))/(1+drv*.6),g,Math.max(.02,k),0); } // lowpass 4
     case 3: return this.s.run(x,g,2-res*1.95,1)*(1+res);                                 // bandpass
     case 4: return this.s.run(x,g,2-res*1.96,2);                                         // highpass 2
     case 5: { const k=2-res*1.9; const y=this.s.run(x,g,k*.7+.3,2); return this.s.run2(y,g,k,2); } // highpass 4
     case 6: return this.s.run(x,g,2-res*1.6,3);                                          // band reject
     case 7: { const d=Math.max(2,Math.min(4000,this.sr/fc)); let rp=this.ci-d; while(rp<0) rp+=4096; const i0=rp|0, f=rp-i0; const dl=this.cb[i0&4095]*(1-f)+this.cb[(i0+1)&4095]*f;
        const y=x+dl*(.5+res*.48)*(drv>.5?-1:1); this.cb[this.ci]=Math.tanh(y); this.ci=(this.ci+1)&4095; return y*.6; }       // comb
     case 8: { const k=Math.max(.02,.35-res*.33); const y=this.s.run(Math.tanh((x+this.y*res*.9)*(1+drv*6)),g,k,1); this.y=y; return Math.tanh(y*1.4)*.7; } // scream
     case 9: { const k=Math.max(.01,2-res*1.99); let y=this.s.run(Math.tanh(x*(1+drv*4)),g,.6+k*.4,0); y=this.s.run2(Math.tanh(y*1.5),g,k,0); return y*.8; } // acid ladder-ish
     case 10: { const y=this.s.run(Math.tanh(x*(2+drv*8))*.5,g,2-res*1.9,0); return Math.tanh(y*2)*.6; } // daft (driven lp2)
    } return x; } }
class DSP{
constructor(sr,post){ this.sr=sr; this.post=post; this.T=buildTables(); this.V=[]; for(let i=0;i<6;i++) this.V.push(this.mkV()); this.p=null; this.q=[]; this.age=0; this.bpm=120; this.bend=0; this.at=0; this.ctr=0;
  this.glfo=[0,0,0,0]; this.gsh=[0,0,0,0];
