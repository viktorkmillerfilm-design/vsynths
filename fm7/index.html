[[[2],[3],[],[5],[6],[]],[1,4],[6,6]],

[[[2],[3],[],[6],[6],[]],[1,4,5],[6,6]],
[[[3],[3],[],[5,6],[],[]],[1,2,4],[3,3]],
[[[3],[3],[],[6],[6],[]],[1,2,4,5],[3,3]],
[[[2],[],[6],[6],[6],[]],[1,3,4,5],[6,6]],
[[[],[3],[],[6],[6],[]],[1,2,4,5],[6,6]],
[[[],[],[6],[6],[6],[]],[1,2,3,4,5],[6,6]],
[[[],[],[],[6],[6],[]],[1,2,3,4,5],[6,6]],
[[[],[3],[],[5,6],[],[]],[1,2,4],[6,6]],
[[[],[3],[],[5,6],[],[]],[1,2,4],[3,3]],
[[[2],[],[4],[5],[],[]],[1,3,6],[5,5]],
[[[],[],[4],[],[6],[]],[1,2,3,5],[6,6]],

  this.V=[]; for(let i=0;i<16;i++) this.V.push({on:false,act:false,n:60,vel:100,age:0,ph:new Float64Array(6),L:new Float32Array(6),st:new Int8Array(6),a:new Float32Array(6),fb1:0,fb2:0,pL:50,pst:0,t:0,fq:0,fqT:0});

  if(this.fn.mono){ v=this.V[0]; for(let i=1;i<16;i++) this.V[i].on=false; const legato=v.on&&v.act; v.n=n; v.vel=vel; v.on=true; v.age=++this.age;

    v.n=n; v.vel=vel; v.on=true; v.age=++this.age; v.fqT=n; v.fq=(this.fn.porta&&this.lastN!==undefined)?this.lastN:n; }
  this.lastN=n; v.act=true; v.t=0; v.pL=p.peg.l[3]; v.pst=0;
  for(let i=0;i<6;i++){ v.st[i]=0; if(p.oks) v.ph[i]=0; if(v.L[i]<1e-3) v.a[i]=0; }
  if(v.L[0]===undefined) v.L.fill(0);

    r=Math.min(99,r+o.rs*Math.max(0,n-21)/12*1.15); let L=v.L[i];

    else if(tg<L){ L-=this.rateSpd(r)*dt; if(L<=tg){L=tg; if(st<3) st++; } }
    else if(st<3) st++;

    if(Math.abs(tg-v.pL)<=sp){ v.pL=tg; if(st<3) v.pst++; } else v.pL+=tg>v.pL?sp:-sp; } }

  const sr=this.sr, tEnd=ct+n/sr; if(this.q.length){ this.q.sort((a,b)=>(a.at||0)-(b.at||0)); while(this.q.length&&(this.q[0].at||0)<tEnd){ const m=this.q.shift();
    if(m.t==='on') this.noteOn(m.n,m.v); else if(m.t==='off') this.noteOff(m.n); else if(m.t==='bend') this.bend=m.v; else if(m.t==='mw') this.mw=m.v; } }

  const fbAmt=p.fb?Math.pow(2,p.fb-7)*.4:0, tab=this.tab, N=this.N, MI=2.0, cs=1/Math.sqrt(car.length)*.22;
  const B=this.B, dt=B/sr; const lfoHz=.062*Math.pow(2,p.lfo.speed*.098);
  const isCar=[0,0,0,0,0,0]; car.forEach(c=>isCar[c]=1);
  const o=new Float32Array(6), inc=new Float64Array(6), da=new Float32Array(6);
  for(let b0=0;b0<n;b0+=B){ const bl=Math.min(B,n-b0);
    // LFO (global)
    const ph0=this.lfoPh; this.lfoPh+=lfoHz*bl/sr; if(this.lfoPh>=1){ this.lfoPh-=1; this.sh=Math.random()*2-1; } const x=this.lfoPh; let lv;
    switch(p.lfo.wave){ case 0: lv=x<.5?4*x-1:3-4*x; break; case 1: lv=1-2*x; break; case 2: lv=2*x-1; break; case 3: lv=x<.5?1:-1; break; case 4: lv=Math.sin(2*Math.PI*x); break; default: lv=this.sh; }
    const mwP=this.fn.mwa&1?this.mw*this.fn.mwr/99:0, mwA=this.fn.mwa&2?this.mw*this.fn.mwr/99:0;
    for(const v of this.V){ if(!v.act) continue; v.t+=dt; this.envStep(v,dt);
      // portamento
      if(v.fq!==v.fqT){ const k=this.fn.porta?Math.exp(-dt/(.002+this.fn.ptime/99*.6)):0; v.fq=v.fqT+(v.fq-v.fqT)*k; if(Math.abs(v.fq-v.fqT)<.001) v.fq=v.fqT; }
      const dl=p.lfo.delay/99, ramp=dl<=0?1:Math.min(1,Math.max(0,(v.t-dl*dl*5)/(.05+dl*1.5)));
      const pmd=Math.min(1,p.lfo.pmd/99*ramp+mwP)*PMS[p.pms], amd=Math.min(1,p.lfo.amd/99*ramp+mwA);

      let alive=false;
      for(let i=0;i<6;i++){ const op=p.op[i];
        let f; if(op.mode){ f=Math.pow(10,op.coarse&3)*Math.pow(10,op.fine/100); } else { f=base*(op.coarse===0?.5:op.coarse)*(1+op.fine/100); } f*=Math.pow(2,(op.det-7)*1.1/1200);

        let ol=op.ol; const bp=21+op.bp, d=(v.n-bp)/12; if(d!==0){ const dep=d<0?op.ld:op.rd, cv=d<0?op.lc:op.rc, ad=Math.abs(d);

      const a=v.a, ph=v.ph; let fb1=v.fb1,fb2=v.fb2;

}}

<script>
/* ===== vsynths shared core (inlined per synth) ===== */
const VS=(()=>{
const V={ctx:null,out:null,analyser:null,inits:[],stops:[],peak:0,nan:false};
const clamp=(v,a,b)=>v<a?a:v>b?b:v; V.clamp=clamp;
V.mtof=n=>440*Math.pow(2,(n-69)/12);
V.noteName=n=>['c','c#','d','d#','e','f','f#','g','g#','a','a#','b'][((n%12)+12)%12]+(Math.floor(n/12)-1);
/* ---------- audio graph + master safety chain ---------- */
V.ensure=()=>{
  if(!V.ctx){
    const C=window.AudioContext||window.webkitAudioContext; const ctx=V.ctx=new C({latencyHint:'interactive'});
    const inp=ctx.createGain(); inp.gain.value=1;
    const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=18; hp.Q.value=.6;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.knee.value=8; comp.ratio.value=3; comp.attack.value=.006; comp.release.value=.2;
    const lim=ctx.createDynamicsCompressor(); lim.threshold.value=-3; lim.knee.value=0; lim.ratio.value=20; lim.attack.value=.001; lim.release.value=.08;
    const clip=ctx.createWaveShaper(); const N=2049,cv=new Float32Array(N); for(let i=0;i<N;i++){const x=i/(N-1)*2-1; cv[i]=Math.tanh(x*1.2)/Math.tanh(1.2)*.97;} clip.curve=cv; clip.oversample='2x';
    const vol=ctx.createGain(); vol.gain.value=.9; V.vol=vol;
    const an=ctx.createAnalyser(); an.fftSize=2048; V.analyser=an;
    inp.connect(hp); hp.connect(comp); comp.connect(lim); lim.connect(clip); clip.connect(vol); vol.connect(an); an.connect(ctx.destination);
    V.out=inp; V.inits.forEach(f=>{try{f(ctx)}catch(e){console.error(e)}});
  }
  if(V.ctx.state!=='running') V.ctx.resume().catch(()=>{});
  return V.ctx;
};
V.onInit=f=>{V.inits.push(f); if(V.ctx) f(V.ctx);};
V.onStop=f=>V.stops.push(f);
V.stopAll=()=>V.stops.forEach(f=>{try{f()}catch(e){}});
V.setVolume=v=>{ if(V.vol) V.vol.gain.setTargetAtTime(clamp(v,0,1)*.9,V.ctx.currentTime,.02); };

V.measure=()=>{ if(!V.analyser) return {peak:0,rms:0,nan:false}; const b=new Float32Array(V.analyser.fftSize); V.analyser.getFloatTimeDomainData(b);
  let p=0,s=0,nan=false; for(const x of b){ if(!isFinite(x)) nan=true; else { const a=Math.abs(x); if(a>p)p=a; s+=x*x; } } return {peak:p,rms:Math.sqrt(s/b.length),nan}; };

   case 26: return [S('OUTPUT LEVEL',0,99,()=>o.ol,v=>o.ol=v)];
   case 27: return [S('KEY VELOCITY',0,7,()=>o.kvs,v=>o.kvs=v)];
   case 28: return [0,1,2,3].map(k=>S('P EG RATE '+(k+1),0,99,()=>P.peg.r[k],v=>P.peg.r[k]=v));
   case 29: return [0,1,2,3].map(k=>S('P EG LEVEL '+(k+1),0,99,()=>P.peg.l[k],v=>P.peg.l[k]=v));
   case 30: return [S('MIDDLE C = ',0,48,()=>P.trans,v=>P.trans=v,v=>NOTE(v+36-12*1))];
   case 31: return Array.from({length:10},(_,k)=>S('NAME CHR '+(k+1),32,90,()=>P.name.charCodeAt(k)||32,v=>{ const a=P.name.padEnd(10).split(''); a[k]=String.fromCharCode(v); P.name=a.join(''); },v=>'"'+String.fromCharCode(v)+'"'));
   case 32: return [S('COPY OP'+(op+1)+' TO OP',1,6,()=>copyTo,v=>copyTo=v)];
  } return null; }
let copyTo=1;
function fdefs(i){ const S=(n,min,max,get,set,f)=>({n,min,max,get,set,f:f||(v=>String(v))}); const F=(k)=>()=>fn[k], G=k=>v=>{fn[k]=v; E({t:'fn',fn}); save();};
  switch(i+1){ case 1: return [S('MASTER TUNE ADJ',0,127,F('tune'),G('tune'),v=>(v>64?'+':'')+(v-64))];
   case 2: return [S('POLY/MONO',0,1,F('mono'),G('mono'),v=>v?'MONO':'POLY')]; case 3: return [S('P BEND RANGE',0,12,F('pbr'),G('pbr'))];
   case 4: return [S('P BEND STEP',0,12,F('pbs'),G('pbs'))]; case 5: return [S('PORTA MODE',0,1,F('porta'),G('porta'),v=>v?'FOLLOW':'RETAIN')];
   case 6: return [S('PORTA/GLISS',0,1,F('pgl'),G('pgl'),v=>v?'GLISS':'PORTA')]; case 7: return [S('PORTA TIME',0,99,F('ptime'),G('ptime'))];
   case 17: return [S('MOD WHEEL RANGE',0,99,F('mwr'),G('mwr'))]; case 18: return [S('WHEEL ASSIGN',0,3,F('mwa'),G('mwa'),v=>['--','PITCH','AMP','P+A'][v])]; }
  return null; }
function press32(i){ VS.ensure();
  if(mode==='play'){ vno=i; P=clone((src==='int'?bank:cart)[i]); if(P.fn){ Object.assign(fn,P.fn); } else { fn.mono=0; } E({t:'fn',fn}); sendPatch(); compare=false; save(); show(); return; }
  if(mode==='func'){ if(i===7){ P=INITV(); sendPatch(); msg('VOICE INIT','COMPLETED'); return; } if(i===8){ P=clone(bank[vno]); sendPatch(); msg('EDIT RECALL','COMPLETED'); return; }
    if(i===31){ msg('BATTERY CHECK','BATT=3.0V'); return; } if(!fdefs(i)){ msg('FUNCTION','NOT AVAILABLE'); return; } sub=prm===i?(sub+1)%fdefs(i).length:0; prm=i; show(); return; }
  if(i<6){ P.op[i].on=P.op[i].on?0:1; sendPatch(); show(); return; }
  if(i===31&&prm===31){ const to=copyTo-1; if(to!==op){ P.op[to]=clone(P.op[op]); sendPatch(); msg('OP COPY','OP'+(op+1)+' > OP'+copyTo+' DONE'); return; } }
  const d=defs(i); sub=(prm===i)?(sub+1)%d.length:0; prm=i; show(); }
function cur(){ const d=mode==='func'?fdefs(prm):defs(prm); return d?d[Math.min(sub,d.length-1)]:null; }
function dataSlide(v){ const c=cur(); if(mode==='play'||!c) return; c.set(Math.round(c.min+v*(c.max-c.min))); changed(); }
function inc(d){ VS.ensure(); if(mode==='play'){ press32((vno+d+32)%32); return; } const c=cur(); if(!c) return; c.set(VS.clamp(c.get()+d,c.min,c.max)); changed(); }
function changed(){ sendPatch(); show(); }
function doStore(){ if(protect){ msg('MEMORY PROTECTED','INT: TURN OFF FIRST'); return; } bank[vno]=clone(P); src='int'; save(); msg('STORE','INT '+(vno+1)+' '+P.name); }
function setMode(m){ mode=m; if(m==='edit'&&!defs(prm)) prm=7; if(m==='func'&&!fdefs(prm)) prm=0; compare=false; sub=0; show(); }
let msgT=0; function msg(a,b){ lcd.textContent=(a||'').padEnd(16).slice(0,16)+'\n'+(b||'').padEnd(16).slice(0,16); clearTimeout(msgT); msgT=setTimeout(show,1200); }
VS.onTouch=null;
function show(){ clearTimeout(msgT);
  led.textContent=String(vno+1).padStart(2,'0');
  let l1='',l2='';
  if(mode==='play'){ l1=(src==='int'?'INTERNAL VOICE':'CARTRIDGE VOICE'); l2=(P.name||'').trim(); }
  else if(mode==='edit'){ const bits=P.op.map(o=>o.on?'1':'0').join(''); l1=(compare?'COMPARE ':'ALG'+pad(P.alg)+'   ')+bits.slice(0,6); l1=('ALG'+pad(P.alg)+(compare?' CMP  ':' OP'+(op+1)+' ')+bits).slice(0,16);
    if(prm<6) l2='OP ON/OFF '+bits; else { const c=cur(); l2=(c.n+'='+c.f(c.get())); } }
  else { l1='FUNCTION CONTROL'; const c=cur(); l2=c?(c.n+'='+c.f(c.get())):'-'; }
  lcd.textContent=l1.padEnd(16).slice(0,16)+'\n'+l2.padEnd(16).slice(0,16);
  PB.forEach((b,i)=>{ b.classList.toggle('lit',mode==='play'?i===vno:mode==='edit'?(i<6?!!P.op[i].on:i===prm):i===prm); });
  labs.forEach((l,i)=>l.innerHTML=mode==='func'?FN[i]:ED[i]);
  mbs[3].classList.toggle('lit',mode==='edit'); mbs[4].classList.toggle('lit',mode==='play'&&src==='int'); mbs[5].classList.toggle('lit',mode==='play'&&src==='cart'); mbs[6].classList.toggle('lit',mode==='func'); mbs[1].classList.toggle('lit',protect); mbs[2].classList.toggle('lit',mode==='edit');
  const c=cur(); if(mode!=='play'&&c) fData.set((c.get()-c.min)/Math.max(1,c.max-c.min),false);
  drawAlg(); }
/* algorithm diagrams */
function layoutAlg(a){ const A=ALG[a-1], mods=A[0], car=A[1]; const par={}; mods.forEach((l,i)=>l.forEach(m=>(par[m]=par[m]||[]).push(i+1)));
  const pos={}; let cur=0; const shared=o=>(par[o]||[]).length>1;
  const place=(o,x0,y)=>{ const ch=mods[o-1].filter(m=>!shared(m)); if(!ch.length){ pos[o]=[x0+.5,y]; return 1; } let w=0; ch.forEach(m=>{ w+=place(m,x0+w,y-1); }); pos[o]=[ch.reduce((s,m)=>s+pos[m][0],0)/ch.length,y]; return w; };
  car.forEach(c=>{ cur+=place(c,cur,0); });
  let guard=0; while(Object.keys(pos).length<6&&guard++<10) for(let o=1;o<=6;o++) if(!pos[o]&&shared(o)&&par[o].every(p=>pos[p])){ const ps=par[o]; pos[o]=[ps.reduce((s,p)=>s+pos[p][0],0)/ps.length,Math.min(...ps.map(p=>pos[p][1]))-1];
      const ch=mods[o-1]; let w=0; ch.forEach(m=>{ w+=place(m,pos[o][0]-.5+w,pos[o][1]-1); }); }
  return {pos,mods,car,fb:A[2],cols:cur}; }
function drawDiagram(g,a,x0,y0,w,h,hl,nums=true){ const {pos,mods,car,fb,cols}=layoutAlg(a); const ys=Object.values(pos).map(p=>p[1]); const rows=1-Math.min(...ys);
  const cw=Math.min(w/(cols+.6),h/(rows+.35)*1.25), ch=Math.min(h/(rows+.35),cw*1.1); const bs=Math.min(cw*.6,ch*.58);
  const ox=x0+(w-cols*cw)/2, oy=y0+(h-(rows+.35)*ch)/2+(rows-1)*ch+ch/2; const P=o=>[ox+pos[o][0]*cw, oy+pos[o][1]*ch];
  g.lineWidth=Math.max(.8,bs*.09);
  for(let o=1;o<=6;o++) mods[o-1].forEach(m=>{ const [ax,ay]=P(m),[bx,by]=P(o); g.beginPath(); g.moveTo(ax,ay+bs/2); if(Math.abs(ax-bx)>.5){ const my=by-bs/2-(ch-bs)/2; g.lineTo(ax,my); g.lineTo(bx,my);} g.lineTo(bx,by-bs/2); g.stroke(); });
  const cy=oy+bs/2+ch*.22, cx=car.map(c=>P(c)[0]); g.beginPath(); g.moveTo(Math.min(...cx),cy); g.lineTo(Math.max(...cx),cy); car.forEach(c=>{const[px,py]=P(c); g.moveTo(px,py+bs/2); g.lineTo(px,cy);}); g.stroke();
  { const [sx,sy]=P(fb[0]),[dx,dy]=P(fb[1]); const r=bs*.85, top=dy-bs/2-(ch-bs)*.3; g.beginPath(); g.moveTo(sx+bs/2,sy); g.lineTo(Math.max(sx,dx)+r,sy); g.lineTo(Math.max(sx,dx)+r,top); g.lineTo(dx,top); g.lineTo(dx,dy-bs/2); g.stroke(); }
  for(let o=1;o<=6;o++){ const [px,py]=P(o); g.fillStyle=hl&&hl(o)?hl(o):(car.includes(o)?'#4fb3a9':'#d8cfbf'); g.fillRect(px-bs/2,py-bs/2,bs,bs);
    if(nums&&bs>7){ g.fillStyle='#120d0b'; g.font=`700 ${bs*.72}px Arial`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(o,px,py+bs*.05); } } }
function drawChart(){ const g=chart.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,900,76); g.strokeStyle='#8c7f6c';
  for(let a=1;a<=32;a++){ const i=a-1, x=(i%16)*56+2, y=(i>>4)*38; g.fillStyle=a===P.alg?'#ff8a5a':'#6f6253'; g.font='700 7.5px Arial'; g.textAlign='left'; g.textBaseline='top'; g.fillText(a,x,y+1);
    g.strokeStyle=a===P.alg?'#ff8a5a':'#7a6d5c'; drawDiagram(g,a,x+8,y+1,46,35,a===P.alg?(o=>o===op+1?'#ffd9a0':null):(o=>'#8c7f6c'),false); } }
function drawAlg(){ const g=algc.getContext('2d'); g.setTransform(2,0,0,2,0,0); g.clearRect(0,0,274,76);
  g.strokeStyle='#4fb3a9aa'; drawDiagram(g,P.alg,0,10,118,64,o=>!P.op[o-1].on?'#5a4a40':(o===op+1&&mode==='edit'?'#ffd9a0':null));
  // envelope of selected op
  const o=P.op[op], x0=124, w=146, y0=12, h=58; g.strokeStyle='#3d302a'; g.strokeRect(x0,y0,w,h); g.strokeStyle='#ff8a5a'; g.beginPath();
  const tm=r=>.4+ (99-r)/99*2.2; let x=x0, L=o.l[3]; g.moveTo(x,y0+h-L/99*h); const seg=[[o.r[0],o.l[0]],[o.r[1],o.l[1]],[o.r[2],o.l[2]]]; const tot=seg.reduce((s,[r])=>s+tm(r),0)+tm(o.r[3])+1; const sc=w/tot;
  seg.forEach(([r,l])=>{ x+=tm(r)*sc; g.lineTo(x,y0+h-l/99*h); }); x+=sc; g.lineTo(x,y0+h-o.l[2]/99*h); x+=tm(o.r[3])*sc; g.lineTo(x,y0+h-o.l[3]/99*h); g.stroke();
  g.fillStyle='#9c8f7d'; g.font='8px Arial'; g.textAlign='left'; g.textBaseline='top'; g.fillText('ALG '+P.alg+' · FB '+P.fb,2,0); g.fillText('OP'+(op+1)+' '+(o.mode?'FIXED ':'RATIO ')+opFreq(o)+'  OL '+o.ol,x0,0);
  drawChart(); }
/* ---------------- midi export ---------------- */
function buildMidi(){ const PPQ=96, st=24, notes=[]; let name='fm7_seq';
  if(arp.mode!=='off'&&arp.mode!=='seq'&&held.size){ const ns=arpSeq(); const per=arp.rate===2?48:arp.rate===4?24:12; for(let t=0,i=0;t<PPQ*16;t+=per,i++) notes.push({t,d:Math.round(per*.6),n:ns[i%ns.length],v:100}); name='fm7_arp'; }
  else for(let b=0;b<4;b++) seq.forEach((s,i)=>{ if(s) notes.push({t:(b*16+i)*st,d:Math.round(st*.8),n:s.n,v:s.v}); });
  return VS.smf(notes,{bpm:tempo,name,ppq:PPQ,total:PPQ*16}); }
function exportMidi(){ const b=buildMidi(); VS.download(b,(arp.mode!=='off'&&arp.mode!=='seq'&&held.size?'fm7_arp_':'fm7_seq_')+tempo+'bpm.mid'); msg('MIDI EXPORT','4 BARS SAVED'); }
/* ---------------- boot ---------------- */
VS.fit(panel,W,H); drawArp(); drawSteps(); show();
window.FM7={get P(){return P},noteOn,noteOff,press32,setMode,inc,clk,setArp,held,buildMidi,seq,get mode(){return mode},lcd:()=>lcd.textContent,ALG,PRESETS};
