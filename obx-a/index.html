    let v=pool.find(v=>v.gate&&v.layer===L&&v.note===d.n);
    if(!v){ v=pool.filter(v=>!v.active).sort((a,b)=>a.age-b.age)[0]; }

    if(!this.p[0]) return true; const sr=sampleRate;
    for(let b0=0;b0<N;b0+=16){ const t=currentTime+b0/sr; while(this.q.length&&this.q[0].t<=t){ const d=this.q.shift(); if(d.type==='on') this.on(d); else if(d.type==='off') this.off(d); }

      this.env(v,0,tm(sm.fA),tm(sm.fD),sm.fS,tm(sm.fR),dt); this.env(v,1,tm(sm.aA),tm(sm.aD),sm.aS,tm(sm.aR),dt);
      if(v.sA===0){ v.active=false; v.gate=false; v.ampPrev=0; v.s0=v.s1=v.s2=v.s3=v.z1=v.z2=0; continue; }
      if(p.porta>0.01) v.pitch+=(v.target-v.pitch)*(1-Math.exp(-dt/(0.002+sm.porta*sm.porta*1.2))); else v.pitch=v.target;
      if(Math.random()<dt*2) v.dT=Math.random()*2-1; v.drift+=(v.dT-v.drift)*dt*0.8;

try{ if(navigator.requestMIDIAccess) navigator.requestMIDIAccess().then(acc=>{ const hook=i=>i.onmidimessage=m=>{ const [st,a,b]=m.data, t=st&0xF0;
    if(t===0x90&&b>0) noteDown(a,b/127,'midi'); else if(t===0x80||(t===0x90&&b===0)) noteUp(a);
    else if(t===0xE0){ const v=((b<<7)|a)/8192-1; setBendLever(clamp(v,-1,1)); }
    else if(t===0xB0&&a===1) setModLever(b/127); else if(t===0xB0&&a===64) setHold(b>=64); else if(t===0xB0&&(a===120||a===123)) stopAll(); };
    acc.inputs.forEach(hook); acc.onstatechange=e=>{ if(e.port.type==='input'&&e.port.state==='connected') hook(e.port); }; }).catch(()=>{}); }catch(e){}

/* =================== display / refresh =================== */
let flashT=0;
function flash(a,b){ lcd.textContent=(String(a).toUpperCase().slice(0,13))+'\n'+String(b).toUpperCase().slice(0,13); clearTimeout(flashT); flashT=setTimeout(idleLcd,2200); }
function idleLcd(){ lcd.textContent=(cur().name.toUpperCase().slice(0,13))+'\n'+(S.mode==='poly'?'POLY 8':S.mode==='split'?'SPLIT '+nn(S.splitPt):'DOUBLE')+(S.edit?' LO':''); }
function refreshSteps(){ stepEls.forEach(({c,nm},i)=>{ const s=S.seq[i]; c.classList.toggle('has',s.n.length>0&&!s.tie); c.classList.toggle('tie',s.tie); c.classList.toggle('cur',playing&&i===curStep); c.classList.toggle('edit',rec.on&&i===editStep);
  nm.textContent=s.tie?'—':s.n.length?nn(s.n[0])+(s.n.length>1?'+'+(s.n.length-1):''):''; }); }
function refresh(){ refreshers.forEach(f=>f()); arpV[0].textContent=ARPM[S.arp.mode]; arpV[1].textContent=S.arp.range+' OCT'; arpV[2].textContent=ARPR[S.arp.rate]; disp.textContent=(S.bank)+(S.prog+1); refreshSteps(); }
function refreshAll(){ Object.values(knobs).forEach(k=>k.render()); refresh(); idleLcd(); drawEnvs(); }

function fit(){ const pr=getComputedStyle(document.getElementById('probe')), px=v=>parseFloat(v)||0;
  const vw=(window.visualViewport?visualViewport.width:innerWidth)-px(pr.paddingLeft)-px(pr.paddingRight);
  const rot=document.getElementById('rot'), rh=rot.offsetHeight?rot.offsetHeight+10:0;
  const vh=(window.visualViewport?visualViewport.height:innerHeight)-px(pr.paddingTop)-px(pr.paddingBottom)-rh;
  const m=vw<1000?2:16, s=Math.min((vw-m)/W,(vh-m)/H); panel.style.transform=`scale(${s})`; const st=document.getElementById('stage'); st.style.width=W*s+'px'; st.style.height=H*s+'px'; }
addEventListener('resize',fit); addEventListener('orientationchange',()=>setTimeout(fit,250)); if(window.visualViewport) visualViewport.addEventListener('resize',fit); fit();
drawKeyLabels(); refreshAll();

/* =================== test / automation hooks =================== */
async function renderOffline(sec=3,events=null,patchOverride=null){ const sr=44100, oc=new OfflineAudioContext(2,Math.round(sr*sec),sr); const e=new Engine(oc);
  const ev=events||[[0,[60,64,67]],[0.8,[62,65,69]],[1.6,[55,59,62,65,69,72,76,79]]], list=[];
  ev.forEach(([t,ns,len=0.6])=>ns.forEach(n=>{ list.push({type:'on',n,v:.9,t,layer:0},{type:'off',n,t:t+len,layer:0}); }));
  await e.init({p0:patchOverride||S.up,p1:S.lo,events:list}); if(e.kind!=='worklet') list.forEach(m=>e.nat(m));
  const buf=await oc.startRendering(); let peak=0,nan=0,ss=0; for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<d.length;i++){ const x=d[i]; if(!isFinite(x)){ nan++; continue; } const a=Math.abs(x); if(a>peak) peak=a; ss+=x*x; } }
  return {peak,nan,rms:Math.sqrt(ss/(buf.length*2)),kind:e.kind}; }
window.OBXA={S,FACTORY,Engine,noteDown,noteUp,play,stop,stopAll,buildMidi,loadProg,setMode,renderOffline,get eng(){ return eng; },get ctx(){ return ctx; },get playing(){ return playing; }};
</script>
